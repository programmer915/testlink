/** "Reset" never deletes the attempt — it flips status to 'invalidated'
    so the record (answers, timestamps, tab switches) is kept for your
    reference, and separately releases the mobile-number claim so a
    genuinely new attempt can be created. That new attempt goes through
    the exact same startAttempt()/firestore.rules path as any first
    attempt, so the same time-allowance and duration limits apply —
    nothing about attempt-limit enforcement is weakened by resetting. */
async function resetAttempt(testId, attemptId, mobileKey){
  if(!confirm('Reset this attempt? The old record is kept (not deleted) for your reference, and the student will be able to start the test again from scratch with a fresh full time allowance.')) return;
  try{
    await dbf.collection('tests').doc(testId).collection('attempts').doc(attemptId)
      .update({status:'invalidated', invalidatedAt: Date.now()});
    if(mobileKey) await dbf.collection('tests').doc(testId).collection('mobileClaims').doc(mobileKey).delete().catch(()=>{});
    toast('Attempt reset — the old record is kept, and they can attempt again');
  }catch(err){ toast('Could not reset: '+err.message); }
}
function openResponseModal(testId, resultId){
  const test = getDB().tests[testId];
  const result = (getDB().results[testId]||[]).find(r=>r.id===resultId);
  if(!test || !result) return;
  const key = answerKeyCache[testId] || null;
  const modal=document.createElement('div');
  modal.className='modalbg';
  modal.innerHTML = `
    <div class="modal" style="max-width:680px;">
      <h3 style="margin-bottom:2px;">${esc(result.student.name)}</h3>
      <p class="muted small" style="margin-bottom:16px;">${esc(result.student.class||'')} ${esc(result.student.roll||'')}${result.student.mobile? ' · '+esc(result.student.mobile):''} · ${result.score} / ${result.maxScore} (${result.percentage.toFixed(1)}%)</p>
      ${test.questions.map((q,i)=>{
        const wasCorrect = result.perQuestionCorrect? result.perQuestionCorrect[q.id] : null;
        return renderQuestionReviewCard(q, i, result.answers[q.id], wasCorrect, key && key[q.id]);
      }).join('')}
      <div class="row" style="justify-content:flex-end; margin-top:6px;">
        <button class="btn secondary" onclick="this.closest('.modalbg').remove()">Close</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}
/** Builds a clean, print-ready question paper from the test's actual
    configured question order — no answers included, since this is the
    student-facing document (see the docx library loaded in <head>). */
function buildQuestionPaperDoc(test){
  const { Document, Paragraph, TextRun, HeadingLevel, AlignmentType } = docx;
  const totalMarks = test.questions.reduce((a,q)=>a+q.marks,0);
  const children = [];

  children.push(new Paragraph({
    text: test.meta.name,
    heading: HeadingLevel.HEADING_1,
    alignment: AlignmentType.CENTER
  }));

  const metaBits = [
    `Total Questions: ${test.questions.length}`,
    `Total Marks: ${totalMarks}`,
    `Duration: ${test.config.duration} minutes`,
    test.config.negativeMarking
      ? `Negative Marking: -${test.config.negativeValue} per wrong answer`
      : 'Negative Marking: None'
  ];
  children.push(new Paragraph({
    alignment: AlignmentType.CENTER,
    spacing:{ after: 300 },
    children: [ new TextRun({ text: metaBits.join('     |     '), italics:true, size:20 }) ]
  }));

  children.push(new Paragraph({
    spacing:{ after: 400 },
    children: [ new TextRun({ text:'Name: ________________________________          Class: __________          Roll No.: __________', size:20 }) ]
  }));

  test.questions.forEach((q,i)=>{
    children.push(new Paragraph({
      spacing:{ before:220, after:90 },
      children:[
        new TextRun({ text:`Q${i+1}. `, bold:true }),
        new TextRun({ text:q.text }),
        new TextRun({ text:`   [${q.marks} mark${q.marks===1?'':'s'}]`, italics:true, size:18 })
      ]
    }));
    if(q.type==='numerical'){
      children.push(new Paragraph({
        indent:{ left:420 }, spacing:{ after:40 },
        children:[ new TextRun({ text:'Answer: ______________________________' }) ]
      }));
    } else {
      q.options.forEach((o,oi)=>{
        children.push(new Paragraph({
          indent:{ left:420 },
          spacing:{ after:40 },
          children:[ new TextRun({ text:`${String.fromCharCode(65+oi)}. ${o.text}` }) ]
        }));
      });
    }
  });

  return new Document({ sections:[{ properties:{}, children }] });
}
async function exportQuestionPaperDocx(testId){
  const test = getDB().tests[testId];
  if(!test){ toast('Test not found'); return; }
  if(typeof docx === 'undefined'){ toast('Document library failed to load — check your internet connection'); return; }
  if(test.questions.length===0){ toast('This test has no questions yet'); return; }
  toast('Generating document…');
  try{
    const doc = buildQuestionPaperDoc(test);
    const blob = await docx.Packer.toBlob(doc);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download = `${test.meta.name.replace(/[^a-z0-9]+/gi,'_')}_question_paper.docx`;
    a.click();
  }catch(err){
    toast('Could not generate document: '+err.message);
  }
}
/** Deletes a submitted attempt entirely and releases its mobile-number
    claim (if it had one), so a corrected retry becomes possible. This is
    the teacher's override for wrong/duplicate/fraudulent entries — it's
    allowed by firestore.rules only for the test's own owner. */
async function removeResultEntry(testId, resultId, mobile){
  if(!confirm('Remove this submission? This cannot be undone, and the student will be able to attempt again if their mobile number is released too.')) return;
  try{
    await dbf.collection('tests').doc(testId).collection('attempts').doc(resultId).delete();
    const key = canonicalMobile10(mobile);
    if(key) await dbf.collection('tests').doc(testId).collection('mobileClaims').doc(key).delete().catch(()=>{});
    toast('Submission removed');
  }catch(err){ toast('Could not remove: '+err.message); }
}
function promptReleaseMobile(testId){
  const mobile = prompt('Enter the mobile number to release. This clears their lock on this test (and marks any unfinished attempt under that number as reset, without deleting its record) so they can start again.');
  if(mobile===null) return;
  releaseMobile(testId, mobile);
}
async function releaseMobile(testId, mobile){
  const key = canonicalMobile10(mobile);
  if(!key){ toast('Enter a valid 10-digit mobile number'); return; }
  try{
    await dbf.collection('tests').doc(testId).collection('mobileClaims').doc(key).delete();
    // Also invalidate (never delete) any stuck, never-submitted attempt
    // under that number — otherwise it would keep counting toward
    // "already attempted" checks a teacher might do by eye, even though
    // the claim itself is gone. The old record stays for your reference.
    const snap = await dbf.collection('tests').doc(testId).collection('attempts').where('mobileKey','==',key).get();
    const updates=[];
    snap.forEach(doc=>{ if(doc.data().status==='in-progress') updates.push(doc.ref.update({status:'invalidated', invalidatedAt:Date.now()})); });
    await Promise.all(updates);
    toast('Mobile number released — they can attempt again');
  }catch(err){ toast('Could not release: '+err.message); }
}
function exportCSV(testId){
  const db=getDB(); const test=db.tests[testId];
  const results=db.results[testId]||[];
  const n=results.length;
  const avgPct = n? (results.reduce((a,r)=>a+r.percentage,0)/n).toFixed(1) : '0';
  const totalMarks = test? test.questions.reduce((a,q)=>a+q.marks,0) : '';

  // A short "report header" block so the file is self-explanatory on its

    ['Number Of Submissions', n],

  const rows = [...header, [], // blank row separates the header block from the data table

  results.forEach(r=>rows.push([r.student.name, r.student.class||'', r.student.roll||'', r.student.mobile||'', r.score, r.maxScore, r.percentage.toFixed(1), r.tabSwitches, Math.round(r.timeTakenMs/1000), new Date(r.submittedAt).toISOString()]));

  const csv = rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');

/* ============================================================
   STUDENT ATTEMPT FLOW
   ------------------------------------------------------------
   No Cloud Functions in this build (free Spark plan only) — an attempt
   document in Firestore (tests/{id}/attempts/{id}) is still the sole
   source of truth for the timer's start time and remaining allowance,
   the question/option order, answers, the marked-for-review set, and
   tab-switch count. firestore.rules is what actually enforces the
   timer, checking every write against the server's own clock
   (request.time) rather than trusting the browser's. Grading happens
   in the student's own browser at submission (see finishExam below) —
   a deliberate tradeoff explained in firestore.rules and README.md.
   The browser keeps nothing but a small pointer — the attemptId — in
   localStorage, purely so a refresh or a closed-and-reopened tab can
   fetch that same record back.
   ============================================================ */
function renderAttemptShell(){ return `<div class="examshell" id="examshell"></div>`; }

async function mountAttempt(hash){
  const el = document.getElementById('examshell');
  const slug = decodeURIComponent(hash.replace('#/attempt/',''));

  el.innerHTML = `<div class="fullload"><span class="spinner"></span>Loading test…</div>`;
  let test;
  try{
    const snap = await dbf.collection('tests').where('slug','==',slug).where('status','==','published').limit(1).get();
    if(snap.empty){
      el.innerHTML = `<div class="empty"><h3>Test not found</h3><p>This link may have been unpublished, or it's mistyped. Ask your teacher to resend it.</p></div>`;
      return;
    }
    test = snap.docs[0].data(); test.id = snap.docs[0].id;
  }catch(err){
    el.innerHTML = `<div class="empty"><h3>Couldn't load this test</h3><p class="small muted">${esc(err.message)}</p></div>`;
    return;
  }

  attemptState = {
    phase:'details', test, storageKey:'testlink_attemptid_'+test.id,
    student:{name:'',class:'',roll:'',mobile:''},
    attemptId:null, answers:{}, marked:{}, tabSwitches:0, currentIdx:0,
    startedAt:null, availableMs:null, order:null, optOrder:null, clockOffset:0
  };

  // If this browser already started (or finished) this test — a refresh,
  // or the tab was closed and the link opened again — resume it from the
  // server instead of showing the details form again.
  const savedAttemptId = localStorage.getItem(attemptState.storageKey);
  if(savedAttemptId){
    await resumeAttempt(savedAttemptId);
    return;
  }
  drawAttempt();
}

/** Lets a teacher walk through their own exam UI before publishing —
    reuses the exact same phase machine and rendering as a real student
    attempt, but starts from the test already sitting in memory (no
    Firestore fetch by slug needed) and is flagged `preview:true`, which
    startAttempt()/syncProgress()/finishExam() all check to skip every
    network write. Nothing here ever touches an attempt or mobileClaims
    document, so it can never count as, or block, a real attempt. */
function mountPreview(testId){
  const test = getDB().tests[testId];
  const el = document.getElementById('examshell');
  if(!test){ el.innerHTML = `<div class="empty"><h3>Test not found</h3></div>`; return; }
  if(!test.questions.length){ el.innerHTML = `<div class="empty"><h3>No questions yet</h3><p>Add some questions before previewing.</p></div>`; return; }
  attemptState = {
    phase:'instructions', test, storageKey:null, preview:true,
    student:{name:'Preview',class:'',roll:'',mobile:''},
    attemptId:null, answers:{}, marked:{}, tabSwitches:0, currentIdx:0,
    startedAt:null, availableMs:null, order:null, optOrder:null, clockOffset:0
  };
  drawAttempt();
}

async function resumeAttempt(attemptId){
  const el = document.getElementById('examshell');
  el.innerHTML = `<div class="fullload"><span class="spinner"></span>Restoring your exam…</div>`;
  try{
    const ref = attemptRef(attemptId);
    const snap = await ref.get();
    if(!snap.exists){
      localStorage.removeItem(attemptState.storageKey);
      drawAttempt();
      return;
    }
    const a = snap.data();
    applyAttemptResponse(a, attemptId);
  }catch(err){
    // Stale or unrecognized pointer — clear it and let the student start fresh.
    localStorage.removeItem(attemptState.storageKey);
    drawAttempt();
  }
}
function attemptRef(attemptId){
  return dbf.collection('tests').doc(attemptState.test.id).collection('attempts').doc(attemptId);
}

function applyAttemptResponse(a, attemptId){
  if(a.status==='submitted'){
    const cached = localStorage.getItem('testlink_result_'+attemptState.test.id);
    if(cached){
      try{
        attemptState.result = JSON.parse(cached);
        attemptState.phase='submitted';
        drawAttempt();
        return;
      }catch(e){ /* fall through */ }
    }
    if(typeof a.percentage === 'number'){
      attemptState.result = a; // the attempt doc already holds the graded result
      attemptState.phase='submitted';
    } else {
      // Missing graded fields (e.g. an older attempt from before this build) —
      // show a plain notice instead of crashing the result screen.
      attemptState.phase='alreadysubmitted';
    }
    drawAttempt();
    return;
  }
  attemptState.attemptId = attemptId;
  attemptState.student = a.student;
  attemptState.order = a.order;
  attemptState.optOrder = a.optOrder;
  attemptState.answers = a.answers || {};
  attemptState.marked = a.marked || {};
  attemptState.tabSwitches = a.tabSwitches || 0;
  attemptState.currentIdx = a.currentIdx || 0;
  attemptState.startedAt = a.startedAt;
  attemptState.availableMs = a.availableMs;
  attemptState.clockOffset = 0; // always 0 now — see syncProgress() for why the read-back was removed
  attemptState.phase = 'exam';
  localStorage.setItem(attemptState.storageKey, attemptId);

  // Resuming (refresh, reopened tab, reconnect after being offline) must
  // never hand back time that already ran out while this browser was away.
  // If the allowance is already spent, skip straight to an auto-submit
  // instead of drawing the exam UI and waiting for the next 1s tick — that
  // gap would otherwise let a resumed-but-expired attempt sit interactable,
  // even if only briefly. firestore.rules independently rejects the write
  // too if it somehow arrives past the deadline anyway.
  if(Date.now() - attemptState.startedAt >= attemptState.availableMs){
    finishExam(true); // finishExam() draws its own "Submitting…" state immediately
    return;
  }

  attachExamRuntime();
  drawAttempt();
  syncProgressSafe(); // pulls a real clock-offset reading immediately, rather than waiting for the first heartbeat
}

function drawAttempt(){
  const el = document.getElementById('examshell');
  const t = attemptState.test; const c = t.config;
  const now = Date.now();

  if(attemptState.phase==='details'){
    if(c.deadlineAt && now > c.deadlineAt){
      el.innerHTML = `<div class="instr center"><h2>Submissions closed</h2><p class="muted">This test is no longer accepting attempts — the deadline has passed.</p></div>`;
      return;
    }
    if(c.startAt && now < c.startAt){
      el.innerHTML = `<div class="instr center"><h2>Not open yet</h2><p class="muted">This test opens at ${fmtDateTime(c.startAt)}.</p></div>`;
      return;
    }
    el.innerHTML = `
      <div class="instr">
        <h2 style="margin-bottom:6px;">${esc(t.meta.name)}</h2>
        <p class="muted small" style="margin-bottom:14px;">Enter your details to begin.</p>
        <ul class="small muted" style="margin:0 0 20px; padding-left:18px; line-height:1.7;">
          <li><strong>Name:</strong> Enter your full registered name.</li>
          <li><strong>Class:</strong> Enter/select the correct class.</li>
          <li><strong>Roll number:</strong> Enter the registered roll number.</li>
          <li><strong>Mobile number:</strong> Enter the registered 10-digit number.</li>
        </ul>
        <div id="s_error"></div>
        <div class="fieldgrid">
          <div><label class="field">Full name</label><input type="text" id="s_name" value="${esc(attemptState.student.name)}"></div>
          <div><label class="field">Roll number</label><input type="text" id="s_roll" value="${esc(attemptState.student.roll)}"></div>
          <div><label class="field">Class</label>
            <select id="s_class">
              <option value="">Select class</option>
              ${CLASS_OPTIONS.map(c=>`<option value="Class ${c}" ${attemptState.student.class==='Class '+c?'selected':''}>Class ${c}</option>`).join('')}
            </select>
          </div>
          <div><label class="field">Mobile Number</label><input type="text" id="s_mobile" value="${esc(attemptState.student.mobile)}"></div>
        </div>
        <button class="btn amber" id="s_continue" onclick="submitDetails()">Continue →</button>
      </div>`;
    return;
  }

  if(attemptState.phase==='instructions'){
    const available = Math.min(c.duration*60000, c.deadlineAt? (c.deadlineAt-now):Infinity);
    const totalQuestions = t.questions.length;
    const totalMarks = t.questions.reduce((a,q)=>a+q.marks,0);
    const negText = c.negativeMarking
      ? `Yes — ${c.negativeValue} mark${c.negativeValue===1?'':'s'} deducted for each incorrect answer by default (individual questions may specify a different deduction).`
      : 'No negative marking — incorrect and unattempted questions are not penalized.';
    el.innerHTML = `
      <div class="instr">
        <h2 style="margin-bottom:6px;">${esc(t.meta.name)}</h2>
        <p class="muted small" style="margin-bottom:18px;">Please read before you begin.</p>
        <div class="resultgrid" style="grid-template-columns:1fr 1fr; margin-bottom:20px;">
          <div><div class="n">${totalQuestions}</div><div class="l">Total Questions</div></div>
          <div><div class="n">${totalMarks}</div><div class="l">Total Marks</div></div>
        </div>
        <ul>
          <li>You will have about <strong>${fmtTime(available)}</strong> to complete this test${c.deadlineAt? ' (limited by the test deadline)':''} — the exact allowance is fixed the moment you start.</li>
          <li>The timer starts the moment you click Start, is enforced by the server, and cannot be paused, reset, or extended by changing your device's clock.</li>
          <li><strong>Negative marking:</strong> ${negText}</li>
          <li>${c.allowReview? 'You can move between questions freely and change answers before submitting.':'Questions must be answered in order and cannot be revisited.'}</li>
          ${attemptState.preview? '' : `
          <li>Switching tabs or windows is recorded and shown to your teacher.</li>
          <li>If you refresh or reopen this link, your exam resumes exactly where you left off, with the same time remaining.</li>`}
          <li>The test submits automatically when time runs out.</li>
        </ul>
        <button class="btn amber" onclick="startAttempt()">Start Test</button>
      </div>`;
    return;
  }

  if(attemptState.phase==='exam'){
    drawExam();
    return;
  }

  if(attemptState.phase==='alreadysubmitted'){
    el.innerHTML = `<div class="instr center"><h2>Already submitted</h2><p class="muted">You've already completed this test from this device. If you need your result, ask your teacher.</p></div>`;
    return;
  }

  if(attemptState.phase==='submitted'){
    drawResult();
    return;
  }
}
function showDetailsError(msg){
  const el = document.getElementById('s_error');
  if(el) el.innerHTML = msg ? `<div class="empty" style="padding:12px 14px; margin-bottom:16px; border-color:var(--red-soft);"><p class="small" style="color:var(--red); margin:0;">${esc(msg)}</p></div>` : '';
}
/** Validates the typed details against this test's class list (if the
    teacher has one configured for this test's class) before an attempt or
    mobile-claim is ever written. firestore.rules independently re-checks
    the same class-list match at write time (see canCreateAttempt in
    firestore.rules) — this client-side pass exists only to give a fast,
    friendly error instead of a raw permission-denied. */
async function submitDetails(){
  const mobileRaw = document.getElementById('s_mobile').value.trim();
  const canonicalMobile = canonicalMobile10(mobileRaw);
  const name = document.getElementById('s_name').value.trim();
  const roll = document.getElementById('s_roll').value.trim();
  const cls = document.getElementById('s_class').value.trim();
  showDetailsError('');

  if(!canonicalMobile){
    showDetailsError('Please enter a valid 10-digit mobile number.');
    return;
  }
  if(!name){
    showDetailsError('Please enter your full name.');
    return;
  }

  let student = {
    name: name || 'Anonymous', roll, class: cls,
    mobile: canonicalMobile, normalizedName: normalizeName(name)
  };

  const t = attemptState.test;
  const assignedClass = (t.meta && t.meta.assignedClass) || '';
  const btn = document.getElementById('s_continue');
  if(assignedClass){
    if(btn){ btn.disabled = true; btn.textContent = 'Checking…'; }
    try{
      const rid = rosterIdFor(t.ownerId, assignedClass);
      const rosterSnap = await dbf.collection('classRosters').doc(rid).get();
      const rosterActive = rosterSnap.exists && (rosterSnap.data().studentCount||0) > 0;
      if(rosterActive){
        const studentSnap = await dbf.collection('classRosters').doc(rid)
          .collection('students').doc(canonicalMobile).get();
        const match = studentSnap.exists ? studentSnap.data() : null;
        const ok = match
          && match.normalizedName === student.normalizedName
          && normalizeField(match.class) === normalizeField(assignedClass)
          && (!match.roll || normalizeField(match.roll) === normalizeField(roll));
        if(!ok){
          showDetailsError('Student details not found. Please enter all details correctly.');
          if(btn){ btn.disabled = false; btn.textContent = 'Continue →'; }
          return;
        }
        // Use the class list's own canonical record so what gets stored
        // (and what firestore.rules compares against) is byte-for-byte the
        // same as the registered entry, not whatever capitalization/
        // spacing the student happened to type.
        student = {
          name: match.name, roll: match.roll, class: match.class,
          mobile: canonicalMobile, normalizedName: match.normalizedName
        };
      }
    }catch(err){
      showDetailsError("Couldn't verify your details right now — check your connection and try again.");
      if(btn){ btn.disabled = false; btn.textContent = 'Continue →'; }
      return;
    }
  }

  attemptState.student = student;
  attemptState.phase='instructions';
  drawAttempt();
}

/** Create a brand-new attempt document (the one-time "Start" action).
    startedAt/availableMs are computed here, but firestore.rules independently
    re-validates them against the server's own clock and the test's real
    duration/deadline before allowing the write — a client can't just send
    a bigger availableMs to buy extra time. */
async function startAttempt(){
  const el = document.getElementById('examshell');
  const t = attemptState.test, c = t.config;
  const now = Date.now();
  const deadlineLimit = c.deadlineAt ? (c.deadlineAt - now) : null;
  const availableMs = deadlineLimit!=null ? Math.max(0, Math.min(c.duration*60000, deadlineLimit)) : c.duration*60000;
  const order = c.randomizeQ ? shuffle(t.questions.map(q=>q.id)) : t.questions.map(q=>q.id);
  const optOrder = {};
  t.questions.forEach(q=>{ optOrder[q.id] = c.randomizeOpt ? shuffle(q.options.map(o=>o.id)) : q.options.map(o=>o.id); });

  if(attemptState.preview){
    // No mobile claim, no attempt document, nothing written anywhere —
    // this walkthrough can never count as, or block, a real attempt.
    attemptState.order = order; attemptState.optOrder = optOrder;
    attemptState.startedAt = now; attemptState.availableMs = availableMs;
    attemptState.attemptId = 'preview';
    attemptState.phase = 'exam';
    attachExamRuntime();
    drawAttempt();
    return;
  }

  el.innerHTML = `<div class="fullload"><span class="spinner"></span>Starting…</div>`;
  // student.mobile is already the canonical 10-digit value set in
  // submitDetails() (either what was typed, or — when a class list matched —
  // the roster's own canonical record), so this is just a defensive re-normalize.
  const mobileKey = canonicalMobile10(attemptState.student.mobile);
  // Always writes with increment(1) and never reads first: Firestore
  // resolves a missing field as 0, so a first-ever attempt is naturally a
  // "create" landing on count 1, and every attempt after is an "update"
  // adding 1 more. firestore.rules refuses the write once count would
  // exceed this test's own "Allowed attempts per student" setting — that
  // number is now genuinely enforced, not just a label in Configure.
  if(mobileKey){
    try{
      await dbf.collection('tests').doc(t.id).collection('mobileClaims').doc(mobileKey)
        .set({ student: attemptState.student, count: firebase.firestore.FieldValue.increment(1), updatedAt: now }, {merge:true});
    }catch(err){
      el.innerHTML = `<div class="empty"><h3>Already attempted</h3><p class="small muted">This student has already used up the allowed attempts for this test. If this is a mistake, ask your teacher.</p></div>`;
      return;
    }
  }

  const attempt = {
    testId: t.id, student: attemptState.student, mobileKey, order, optOrder,
    answers:{}, marked:{}, tabSwitches:0, currentIdx:0,
    startedAt: now, availableMs, status:'in-progress'
  };
  try{
    const ref = await dbf.collection('tests').doc(t.id).collection('attempts').add(attempt);
    applyAttemptResponse(attempt, ref.id);
  }catch(err){
    el.innerHTML = `<div class="empty"><h3>Couldn't start the test</h3><p class="small muted">${esc(err.message)}</p></div>`;
  }
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/** The actual fix for the refresh bug: the timer interval and the
    tab-switch listener are attached whenever the exam phase is entered —
    on a fresh start AND on every resume — instead of only once inside a
    "begin" action that never runs again after a refresh. */
function attachExamRuntime(){
  document.removeEventListener('visibilitychange', onVisChange);
  document.addEventListener('visibilitychange', onVisChange);
  clearInterval(window._examTimer);
  clearInterval(window._heartbeatTimer);
  window._examTimer = setInterval(tickTimer, 1000);
  window._heartbeatTimer = setInterval(heartbeat, 30000);
}
function onVisChange(){
  if(document.hidden && attemptState.phase==='exam'){
    attemptState.tabSwitches = (attemptState.tabSwitches||0)+1;
    syncProgressSafe();
  }
}
function isDeadlineError(err){
  // firestore.rules rejects the write once its own clock says time is up —
  // that surfaces here as a plain permission-denied, since rules can only
  // ever allow or deny, not explain why.
  return !!err && err.code==='permission-denied';
}
/** Toggles the "you're offline, we're retrying" banner directly in the
    DOM rather than forcing a full re-render — a re-render mid-sync would
    disrupt a student who's mid-typing a numerical answer. */
function setOfflineState(isOffline){
  attemptState._offline = isOffline;
  const el = document.getElementById('offlineBanner');
  if(el) el.style.display = isOffline ? 'block' : 'none';
}
window.addEventListener('online', ()=>{
  if(attemptState && attemptState.phase==='exam' && !attemptState.preview) syncProgressSafe();
});
window.addEventListener('offline', ()=>{
  if(attemptState && attemptState.phase==='exam') setOfflineState(true);
});
// Best-effort only — browsers don't guarantee an async write finishes once
// the page is actually unloading — but this gives a typed-but-not-yet-synced
// numerical answer a real chance to reach the server instead of silently
// evaporating if a student closes the tab in the middle of typing it.
window.addEventListener('beforeunload', ()=>{
  if(attemptState && attemptState.phase==='exam' && !attemptState.preview && _numDebounce){
    clearTimeout(_numDebounce);
    syncProgressSafe();
  }
});
/** Push the current answers/marks/tab-switches straight to Firestore.
    This intentionally does NOT read the document back afterward — an
    earlier version did, to recalibrate a "clock offset" for the on-screen
    timer, but that cost one extra Firestore read on every single answer
    save and every 30s heartbeat, which is real money against the 50k/day
    free read quota for a value that was only ever cosmetic: the actual
    timer *enforcement* happens independently, in firestore.rules, via
    request.time — the server's own clock — regardless of what this
    on-screen countdown displays. Removing the read-back can't weaken that
    enforcement; at worst, a student actively tampering their system clock
    might briefly see a slightly-off countdown before their next save gets
    rejected right on schedule anyway. */
async function syncProgress(){
  if(!attemptState.attemptId || attemptState.preview) return;
  const ref = attemptRef(attemptState.attemptId);
  await ref.update({
    answers: attemptState.answers, marked: attemptState.marked,
    tabSwitches: attemptState.tabSwitches, currentIdx: attemptState.currentIdx,
    heartbeatAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}
// Every answer/nav action calls this. Once the exam is no longer active
// (already submitted, or not started), this is a silent no-op — a stray
// call firing late (e.g. the numerical-answer debounce below, if it fires
// just after Submit) must never attempt a write or treat rejection as
// "time's up", which previously could re-trigger the whole submit flow
// and show a confusing "Couldn't submit" error to a student who had
// already successfully finished.
function syncProgressSafe(){
  if(attemptState.phase!=='exam') return;
  syncProgress()
    .then(()=> setOfflineState(false))
    .catch(err=>{ if(isDeadlineError(err)) finishExam(true); else setOfflineState(true); });
}
async function heartbeat(){
  if(attemptState.phase!=='exam') return;
  try{ await syncProgress(); setOfflineState(false); }
  catch(err){ if(isDeadlineError(err)) finishExam(true); else setOfflineState(true); }
}
/** The on-screen countdown only — purely cosmetic. Actual enforcement of
    the time limit happens independently in firestore.rules against the
    server's own clock on every save, so this display being briefly off
    (e.g. a student who tampered their system clock) can't extend an exam;
    it can only make what they see locally slightly inaccurate. */
function remainingMs(){
  const estServerNow = Date.now() + (attemptState.clockOffset||0);
  return attemptState.availableMs - (estServerNow - attemptState.startedAt);
}
function tickTimer(){
  if(attemptState.phase!=='exam'){ clearInterval(window._examTimer); return; }
  const rem = remainingMs();
  const tb=document.getElementById('timerbox');
  if(tb){ tb.textContent=fmtTime(rem); tb.classList.toggle('low', rem<60000); }
  if(rem<=0){ clearInterval(window._examTimer); finishExam(true); }
}
function examTypeLabel(type){
  return type==='multiple' ? 'MULTIPLE CHOICE — SELECT ALL THAT APPLY'
    : type==='truefalse' ? 'TRUE OR FALSE'
    : type==='numerical' ? 'NUMERICAL ANSWER'
    : 'SINGLE CHOICE';
}
function drawExam(){
  const el=document.getElementById('examshell');
  const t=attemptState.test;
  const qid = attemptState.order[attemptState.currentIdx];
  const q = t.questions.find(x=>x.id===qid);
  const answered = attemptState.answers[qid]||[];
  const imageHtml = q.image? `<img src="${q.image}" style="max-width:100%; border-radius:6px; margin:10px 0;">` : '';

  let bodyHtml;
  if(q.type==='numerical'){
    const current = answered.length? answered[0] : '';
    bodyHtml = `
      <div style="margin:14px 0;">
        <input type="number" step="any" inputmode="decimal" value="${esc(String(current))}"
          placeholder="Type your numeric answer"
          style="font-size:18px; padding:14px 16px; width:100%; max-width:280px; border:1.5px solid var(--border); border-radius:6px; box-sizing:border-box;"
          oninput="setNumericalAnswer('${qid}', this.value)" onblur="syncProgressSafe()">
        <p class="small muted" style="margin-top:8px;">Enter a number — decimals are fine (e.g. 35.5).</p>
      </div>`;
  } else {
    const optIds = attemptState.optOrder[qid];
    const isMultiple = q.type==='multiple';
    bodyHtml = `
      <div class="examoptions">
        ${optIds.map(oid=>{
          const o=q.options.find(x=>x.id===oid);
          const idx=optIds.indexOf(oid);
          const sel=answered.includes(oid);
          const markStyle = isMultiple ? 'border-radius:4px;' : '';
          return `<div class="optbig ${sel?'sel':''}" onclick="selectOption('${qid}','${oid}')">
            <span class="oletter" style="${markStyle}">${isMultiple? (sel?'✓':'') : letter(idx)}</span><span class="otext">${esc(o.text)}</span>
          </div>`;
        }).join('')}
      </div>`;
  }

  el.innerHTML = `
    <div id="offlineBanner" class="warnbanner" style="display:${attemptState._offline?'block':'none'};">⚠ You appear to be offline. Your most recent answers may not be saved yet — please don't close this tab. We'll keep retrying automatically.</div>
    <div class="exambar">
      <div>
        <div style="font-weight:700;">${esc(t.meta.name)}</div>
        <div class="small muted">${esc(attemptState.student.name)}${attemptState.student.roll? ' · Roll '+esc(attemptState.student.roll):''}</div>
      </div>
      <div class="timerbox" id="timerbox">${fmtTime(remainingMs())}</div>
    </div>

    <div class="qnum">QUESTION ${attemptState.currentIdx+1} OF ${t.questions.length} · ${q.marks} mark${q.marks===1?'':'s'}</div>
    <div style="font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--amber); font-size:13px; margin:6px 0 2px;">${examTypeLabel(q.type)}</div>
    <div class="qtext" style="font-size:17px;">${esc(q.text)}</div>
    ${imageHtml}

    ${bodyHtml}

    <div class="examfoot">
      <div class="row">
        <button class="btn secondary" ${(!t.config.allowReview || attemptState.currentIdx===0)?'disabled':''} onclick="navQ(-1)">← Previous</button>
        <button class="btn secondary" onclick="toggleMark('${qid}')">${attemptState.marked[qid]? 'Unmark':'Mark for review'}</button>
        <button class="btn ghost" onclick="clearAnswer('${qid}')">Clear</button>
      </div>
      ${attemptState.currentIdx < t.questions.length-1?
        `<button class="btn secondary" onclick="navQ(1)">Next →</button>`:
        `<button class="btn amber" onclick="confirmSubmit()">Submit Test</button>`}
    </div>

    <div class="palette">
      ${attemptState.order.map((id,i)=>{
        const cls = attemptState.marked[id]?'review':(attemptState.answers[id]&&attemptState.answers[id].length?'answered':'');
        return `<div class="pnode ${cls} ${i===attemptState.currentIdx?'current':''}" onclick="jumpTo(${i})">${i+1}</div>`;
      }).join('')}
    </div>
  `;
}
function selectOption(qid,oid){
  const t=attemptState.test; const q=t.questions.find(x=>x.id===qid);
  if(q.type==='multiple'){
    const cur=new Set(attemptState.answers[qid]||[]);
    cur.has(oid)? cur.delete(oid): cur.add(oid);
    attemptState.answers[qid]=[...cur];
  } else {
    attemptState.answers[qid]=[oid];
  }
  syncProgressSafe(); drawExam();
}
// Typing in a number field can't trigger a full drawExam() on every
// keystroke (that would destroy and recreate the input, breaking focus
// and cursor position). Instead: update state, refresh only the palette
// dot directly, and debounce the actual save so continuous typing doesn't
// fire a Firestore write per character — onblur above forces an
// immediate save the moment the student moves on.
let _numDebounce = null;
function setNumericalAnswer(qid, value){
  const v = String(value).trim();
  attemptState.answers[qid] = v.length? [v] : [];
  clearTimeout(_numDebounce);
  _numDebounce = setTimeout(syncProgressSafe, 500);
  const idx = attemptState.order.indexOf(qid);
  const dot = document.querySelectorAll('.pnode')[idx];
  if(dot){
    dot.classList.remove('answered','review');
    if(attemptState.marked[qid]) dot.classList.add('review');
    else if(v.length) dot.classList.add('answered');
  }
}
function clearAnswer(qid){ delete attemptState.answers[qid]; syncProgressSafe(); drawExam(); }
function toggleMark(qid){ attemptState.marked[qid]=!attemptState.marked[qid]; syncProgressSafe(); drawExam(); }
function navQ(d){
  const t=attemptState.test;
  const ni=attemptState.currentIdx+d;
  if(ni<0||ni>=t.questions.length) return;
  attemptState.currentIdx=ni; syncProgressSafe(); drawExam();
}
function jumpTo(i){
  if(!attemptState.test.config.allowReview && i<attemptState.currentIdx) return;
  attemptState.currentIdx=i; syncProgressSafe(); drawExam();
}
function confirmSubmit(){
  const t=attemptState.test;
  const unattempted = t.questions.filter(q=>!(attemptState.answers[q.id]&&attemptState.answers[q.id].length)).length;
  if(!confirm(`Submit test now? ${unattempted} question(s) are unattempted.`)) return;
  finishExam(false);
}
async function finishExam(auto){
  // Defense in depth alongside the syncProgressSafe() guard above: once
  // an attempt is submitted (or already mid-submission), never let a
  // second trigger — a stray late write, a double-click, the timer and a
  // manual submit racing — tear down the result screen and start over.
  if(attemptState.phase==='submitted' || attemptState._submitting) return;
  attemptState._submitting = true;
  clearTimeout(_numDebounce); // cancel any pending numerical-answer save; nothing should write after this point
  clearInterval(window._examTimer);
  clearInterval(window._heartbeatTimer);
  document.removeEventListener('visibilitychange', onVisChange);
  const t=attemptState.test;
  const now = Date.now();
  const estServerNow = now + (attemptState.clockOffset||0);
  const timeTakenMs = Math.min(estServerNow - attemptState.startedAt, attemptState.availableMs);

  // "Hidden" result-visibility tests never send the answer key to this
  // browser at all (see saveTest()) — so this device has nothing to grade
  // with. Submit the raw answers only; the teacher's own browser grades
  // it later, against the privately-stored key (see gradeAttempt()).
  const isHidden = t.questions.length && t.questions.some(q=>q.correct===undefined);

  let graded;
  if(isHidden){
    graded = {
      testId: t.id, testName: t.meta.name, student: attemptState.student,
      answers: attemptState.answers, marked: attemptState.marked,
      timeTakenMs, tabSwitches: attemptState.tabSwitches||0,
      submittedAt: now, autoSubmitted: !!auto, status:'submitted'
    };
  } else {
    // Grading happens right here, in the student's browser — there's no
    // server-side compute layer in this free-tier build, so this test's
    // question data already includes the correct answers (see saveTest()).
    // firestore.rules is what still keeps the *timer* honest: this write is
    // independently checked against the server's own clock and rejected if
    // it arrives too long after the real deadline, regardless of what this
    // calculation above says.
    let score=0, maxScore=0, correctCount=0, incorrectCount=0, unattempted=0, negativeDeduction=0;
    const perQuestionCorrect={};
    t.questions.forEach(q=>{
      maxScore += q.marks;
      const given = attemptState.answers[q.id] || [];
      const isCorrect = isAnswerCorrect(q, given, null);
      if(isCorrect===null){ unattempted++; return; }
      perQuestionCorrect[q.id]=isCorrect;
      if(isCorrect){ score+=q.marks; correctCount++; }
      else{
        incorrectCount++;
        const neg = t.config.negativeMarking? (q.negativeMarks||t.config.negativeValue):0;
        negativeDeduction += neg;
        score -= neg;
      }
    });
    score = Math.max(0, score);
    const percentage = maxScore? (score/maxScore*100):0;
    graded = {
      testId: t.id, testName: t.meta.name, student: attemptState.student,
      answers: attemptState.answers, marked: attemptState.marked, perQuestionCorrect,
      score: Math.round(score*100)/100, maxScore, percentage,
      correctCount, incorrectCount, unattempted,
      negativeDeduction: Math.round(negativeDeduction*100)/100,
      timeTakenMs, tabSwitches: attemptState.tabSwitches||0,
      submittedAt: now, autoSubmitted: !!auto, status:'submitted'
    };
  }

  if(attemptState.preview){
    graded.id = 'preview';
    attemptState.result = graded;
    attemptState.phase = 'submitted';
    attemptState._submitting = false;
    drawAttempt();
    return;
  }

  document.getElementById('examshell').innerHTML = `<div class="fullload"><span class="spinner"></span>Submitting…</div>`;
  try{
    await attemptRef(attemptState.attemptId).update(graded);
    graded.id = attemptState.attemptId;
    attemptState.result = graded;
    attemptState.phase='submitted';
    localStorage.setItem('testlink_result_'+t.id, JSON.stringify(graded));
    localStorage.removeItem(attemptState.storageKey); // the attempt is finished; the cached result above takes over for redisplay
    drawAttempt();
  }catch(err){
    attemptState._submitting = false; // let "Try again" actually retry, instead of being silently blocked by the guard above
    document.getElementById('examshell').innerHTML = `
      <div class="empty"><h3>Couldn't submit</h3>
      <p class="small muted">${esc(err.message)}</p>
      <p class="small muted">Nothing has been lost — your answers up to this point are saved on the server. Reopen this link once you're back online and it will pick up right where you left off.</p>
      <button class="btn amber" style="margin-top:10px;" onclick="finishExam(${auto})">Try again</button></div>`;
  }
}
function drawResult(){
  const el=document.getElementById('examshell');
  const t=attemptState.test, r=attemptState.result, vis=t.config.resultVisibility;
  const passed = r.percentage>=t.config.passPercent;
  const showDeduction = t.config.negativeMarking && r.negativeDeduction;
  const exitBtn = attemptState.preview
    ? `<div class="center" style="margin-top:22px;"><button class="btn secondary" onclick="location.hash='#/edit/${t.id}'">Exit Preview</button></div>`
    : '';

  if(vis==='hidden'){
    el.innerHTML = `<div class="resultcard card"><h2>Submitted</h2><p class="muted">Your response has been recorded. Your teacher will release your result later.</p></div>${exitBtn}`;
    return;
  }

  // Only "Show immediately" tests get a full answer-by-answer review —
  // that's the whole point of that visibility setting, and it's exactly
  // the same data ("what did I pick vs. what's correct") the teacher
  // already sees in their own Results view, just shown to the student.
  const reviewHtml = vis==='immediate' ? `
    <div style="max-width:640px; margin:24px auto 60px;">
      <h3 style="margin-bottom:14px; font-size:16px;">Review your answers</h3>
      ${t.questions.map((q,i)=>{
        const wasCorrect = r.perQuestionCorrect? r.perQuestionCorrect[q.id] : null;
        return renderQuestionReviewCard(q, i, r.answers[q.id], wasCorrect, null);
      }).join('')}
    </div>` : '';

  el.innerHTML = `
    <div class="resultcard card">
      <div class="muted small">TEST RESULT</div>
      <h2 style="margin:6px 0;">${esc(r.student.name)}</h2>
      ${vis==='immediate'? `<div class="score">${r.score} / ${r.maxScore}</div><div class="muted">${r.percentage.toFixed(1)}%</div>`
        : `<div class="score">${r.percentage.toFixed(0)}%</div>`}
      <div style="margin:14px 0;"><span class="pill ${passed?'pass':'fail'}">${passed?'PASS':'FAIL'}</span></div>
      ${vis==='immediate'? `
      <div class="resultgrid" style="grid-template-columns:repeat(${showDeduction?4:3},1fr);">
        <div><div class="n">${r.correctCount}</div><div class="l">Correct</div></div>
        <div><div class="n">${r.incorrectCount}</div><div class="l">Incorrect</div></div>
        <div><div class="n">${r.unattempted}</div><div class="l">Unattempted</div></div>
        ${showDeduction? `<div><div class="n" style="color:var(--red);">-${r.negativeDeduction}</div><div class="l">Negative deduction</div></div>`:''}
      </div>`:''}
      <div class="muted small">Time taken: ${fmtTime(r.timeTakenMs)}${r.autoSubmitted? ' · auto-submitted at time limit':''}</div>
    </div>
    ${reviewHtml}
    ${exitBtn}`;
}
</script>
</body>
</html>
