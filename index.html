<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestLink — Online Test &amp; Quiz Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --ink:#1B2430;
  --ink-soft:#3A4454;
  --paper:#F6F3EC;
  --paper-line:#E4DCC8;
  --card:#FFFFFF;
  --amber:#B8792E;
  --amber-soft:#F1E2C9;
  --green:#2F7D5A;
  --green-soft:#DCEEE4;
  --red:#AE4131;
  --red-soft:#F6DFDA;
  --muted:#78716A;
  --border:#DED6C4;
  --shadow: 0 1px 0 rgba(27,36,48,.04);
  --radius: 3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Source Serif 4',serif; font-weight:700; margin:0; color:var(--ink);}
a{color:inherit;}
button{font-family:'Inter',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ---------- layout shells ---------- */
#app{min-height:100vh; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px; border-bottom:1px solid var(--border);
  background:var(--paper);
}
.brand{display:flex; align-items:baseline; gap:8px; cursor:pointer;}
.brand .mark{
  width:26px;height:26px; border:2px solid var(--ink); border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  font-family:'Source Serif 4',serif; font-weight:700; font-size:13px;
}
.brand .name{font-family:'Source Serif 4',serif; font-weight:700; font-size:19px; letter-spacing:.2px;}
.brand .tag{color:var(--muted); font-size:12.5px;}
.topnav{display:flex; gap:22px; font-size:13.5px; color:var(--ink-soft);}
.topnav span{cursor:pointer; padding-bottom:3px; border-bottom:2px solid transparent;}
.topnav span.active{border-bottom-color:var(--amber); color:var(--ink); font-weight:600;}
.shell{flex:1; width:100%; max-width:1080px; margin:0 auto; padding:34px 28px 70px;}
.shell.wide{max-width:1220px;}

/* ---------- generic bits ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 16px; border-radius:var(--radius); border:1px solid var(--ink);
  background:var(--ink); color:#fff; font-size:13.5px; font-weight:600;
  cursor:pointer; transition:transform .06s ease;
}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:transparent; color:var(--ink); border-color:var(--border);}
.btn.ghost{background:transparent; color:var(--ink-soft); border-color:transparent; padding:9px 8px;}
.btn.amber{background:var(--amber); border-color:var(--amber);}
.btn.danger{background:transparent; color:var(--red); border-color:var(--red-soft);}
.btn.small{padding:5px 10px; font-size:12.5px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
.pad{padding:22px;}
.row{display:flex; gap:14px;}
.grow{flex:1;}
label.field{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:600; letter-spacing:.2px;}
input[type=text],input[type=number],input[type=datetime-local],textarea,select{
  width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius);
  background:#fff; font-family:'Inter',sans-serif; font-size:14px; color:var(--ink);
}
textarea{resize:vertical; font-family:'IBM Plex Mono',monospace; font-size:13px;}
.fieldgrid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
.chk{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-soft); padding:8px 0;}
.chk input{width:16px;height:16px;}
.hr{height:1px; background:var(--border); margin:22px 0;}
.badge{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:.3px;}
.badge.verified{background:var(--green-soft); color:var(--green);}
.badge.review{background:var(--red-soft); color:var(--red);}
.badge.edited{background:var(--amber-soft); color:var(--amber);}
.badge.draft{background:#EDEAE0; color:var(--muted);}
.badge.published{background:var(--green-soft); color:var(--green);}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
.center{text-align:center;}
.empty{padding:60px 20px; text-align:center; color:var(--muted);}
.empty h3{color:var(--ink); margin-bottom:6px;}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:11px 20px; border-radius:4px; font-size:13.5px;
  z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.2);
}

/* ---------- dashboard ---------- */
.dash-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:26px;}
.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:30px;}
.stat{padding:16px 18px; border:1px solid var(--border); border-radius:var(--radius); background:var(--card);}
.stat .num{font-family:'Source Serif 4',serif; font-size:26px; font-weight:700;}
.stat .lbl{font-size:12px; color:var(--muted); margin-top:2px;}
.section-title{font-size:12.5px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:26px 0 12px; font-weight:700;}
.test-list{display:flex; flex-direction:column; gap:10px;}
.test-row{display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border:1px solid var(--border); border-radius:var(--radius); background:var(--card);}
.test-row:hover{border-color:var(--ink);}
.test-row .ti h4{font-size:15.5px;}
.test-row .ti .meta{font-size:12.5px; color:var(--muted); margin-top:3px;}
.test-row .ta{display:flex; gap:8px; align-items:center;}

/* ---------- wizard ---------- */
.steps{display:flex; gap:0; margin-bottom:28px; border-bottom:1px solid var(--border);}
.step{padding:10px 4px; margin-right:28px; font-size:13px; color:var(--muted); border-bottom:2px solid transparent; cursor:default;}
.step.on{color:var(--ink); font-weight:700; border-bottom-color:var(--amber);}
.step.done{color:var(--ink-soft);}
.dropzone{
  border:1.5px dashed var(--border); border-radius:var(--radius); padding:40px 20px;
  text-align:center; color:var(--muted); background:#FBF9F4; margin-bottom:18px;
}
.dropzone.drag{border-color:var(--amber); background:var(--amber-soft);}
.spinner{
  width:16px;height:16px; border:2px solid var(--border); border-top-color:var(--ink);
  border-radius:50%; display:inline-block; animation:spin .7s linear infinite; vertical-align:-3px; margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg);}}
.progressline{font-size:12.5px; color:var(--muted); margin-top:10px; min-height:18px;}
.filepill{display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border:1px solid var(--border); border-radius:20px; font-size:12.5px; background:#fff; margin-top:10px;}
.filepill button{border:none; background:none; cursor:pointer; color:var(--red); font-size:13px;}

/* question card - ruled paper feel */
.qcard{
  background:repeating-linear-gradient(var(--card),var(--card) 27px, var(--paper-line) 28px);
  background-color:var(--card);
  border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-bottom:14px;
}
.qhead{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
.qnum{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted);}
.qtext{font-size:15px; margin:6px 0 12px; font-weight:500;}
.opt{display:flex; gap:10px; align-items:flex-start; padding:5px 0; font-size:13.8px;}
.opt .oletter{width:20px;height:20px; border:1.5px solid var(--border); border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;}
.opt.correct .oletter{background:var(--green); border-color:var(--green); color:#fff;}
.qactions{display:flex; gap:6px; margin-top:12px;}
.qmeta-right{text-align:right;}

.editrow{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.editrow input[type=text]{flex:1;}
.editrow .radiomark{cursor:pointer;}

/* ---------- publish ---------- */
.linkbox{display:flex; gap:8px; margin-top:14px;}
.linkbox input{font-family:'IBM Plex Mono',monospace; font-size:12.5px;}

/* ---------- student attempt ---------- */
.examshell{max-width:760px; margin:0 auto; padding:26px 22px 90px;}
.exambar{
  position:sticky; top:0; background:var(--paper); z-index:10;
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 0; border-bottom:1px solid var(--border); margin-bottom:22px;
}
.timerbox{font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; padding:6px 14px; border:1px solid var(--ink); border-radius:4px;}
.timerbox.low{color:var(--red); border-color:var(--red); background:var(--red-soft);}
.palette{display:flex; flex-wrap:wrap; gap:7px; margin:22px 0;}
.pnode{
  width:32px;height:32px; border-radius:4px; border:1px solid var(--border); background:#fff;
  display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; font-family:'IBM Plex Mono',monospace;
}
.pnode.answered{background:var(--green); color:#fff; border-color:var(--green);}
.pnode.review{background:var(--amber); color:#fff; border-color:var(--amber);}
.pnode.current{outline:2px solid var(--ink); outline-offset:1px;}
.optbig{
  display:flex; gap:12px; align-items:center; padding:13px 15px; border:1px solid var(--border);
  border-radius:var(--radius); margin-bottom:9px; cursor:pointer; background:#fff;
  min-height:48px; box-sizing:border-box;
}
.optbig:hover{border-color:var(--ink-soft);}
.optbig.sel{border-color:var(--ink); background:var(--amber-soft);}
.optbig .oletter{width:24px;height:24px;border:1.5px solid var(--border);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.optbig.sel .oletter{background:var(--ink); color:#fff; border-color:var(--ink);}
.optbig .otext{line-height:1.45; word-break:break-word; overflow-wrap:anywhere;}
.examoptions{min-height:230px;}
.examfoot{display:flex; justify-content:space-between; align-items:center; margin-top:24px;}

.instr{max-width:640px; margin:60px auto; text-align:left;}
.instr ul{padding-left:20px; color:var(--ink-soft); font-size:14px; line-height:1.8;}
.warnbanner{background:var(--red-soft); color:var(--red); padding:10px 14px; border-radius:4px; font-size:13px; margin-bottom:16px;}

.resultcard{max-width:520px; margin:40px auto; padding:34px; text-align:center;}
.resultcard .score{font-family:'Source Serif 4',serif; font-size:52px; font-weight:700; margin:6px 0;}
.resultgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:22px 0;}
.resultgrid div{padding:12px; border:1px solid var(--border); border-radius:4px;}
.resultgrid .n{font-size:20px; font-weight:700; font-family:'Source Serif 4',serif;}
.resultgrid .l{font-size:11px; color:var(--muted); margin-top:2px;}
.pill{display:inline-block; padding:4px 14px; border-radius:20px; font-weight:700; font-size:13px;}
.pill.pass{background:var(--green-soft); color:var(--green);}
.pill.fail{background:var(--red-soft); color:var(--red);}

table.results{width:100%; border-collapse:collapse; font-size:13.5px;}
table.results th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--border);}
table.results td{padding:9px 10px; border-bottom:1px solid var(--paper-line);}
table.results tr:hover td{background:#FBF9F4;}

.modalbg{position:fixed; inset:0; background:rgba(27,36,48,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{background:#fff; border-radius:6px; max-width:560px; width:100%; max-height:88vh; overflow:auto; padding:24px;}
.authshell{max-width:400px; margin:70px auto 0; padding-bottom:60px;}
.authmsg{background:var(--red-soft); color:var(--red); padding:9px 12px; border-radius:4px; font-size:13px; margin-bottom:12px;}
.synctag{font-size:11px; padding:2px 9px; border-radius:20px; font-weight:700;}
.synctag.online{background:var(--green-soft); color:var(--green);}
.synctag.offline{background:#EDEAE0; color:var(--muted);}
.fullload{display:flex; align-items:center; justify-content:center; min-height:60vh; color:var(--muted);}
@media (max-width:720px){
  .fieldgrid{grid-template-columns:1fr;}
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .resultgrid{grid-template-columns:1fr 1fr;}
  .topnav{display:none;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   TESTLINK — Phase-1 client-side prototype
   No backend: test data is embedded (base64) in the shareable
   link itself, so any device can open it and take the test.
   Results are saved locally for the teacher's own browser, and
   students can also send back a "result code" file the teacher
   imports into the Results tab — this lets results travel
   across devices without a server.
   ============================================================ */

/* ---------------- utils ---------------- */
const uid = (p='id') => p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
function fmtTime(ms){
  if(ms<0) ms=0;
  const s=Math.floor(ms/1000);
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return (h>0?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function fmtDateTime(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleString([], {dateStyle:'medium', timeStyle:'short'}); }
function fmtDateTimeExact(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleString([], {dateStyle:'medium', timeStyle:'medium'}); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function letter(i){ return String.fromCharCode(65+i); }
// Normalizes a mobile number down to digits only, so "+91 98765-43210" and
// "9876543210" collide to the same dedup key regardless of formatting.
function sanitizeMobile(m){ return (m||'').replace(/[^0-9]/g,''); }
// Canonical mobile key used everywhere a student is identified: strips all
// non-digits, then keeps the LAST 10 digits (so a "+91 98765 43210" country-
// code entry and a bare "9876543210" entry collide to the same 10-digit
// key). Returns '' if there aren't at least 10 digits — callers treat that
// as invalid.
function canonicalMobile10(m){
  const d = sanitizeMobile(m);
  if(d.length < 10) return '';
  return d.slice(-10);
}
// Collapses internal whitespace and trims, then lowercases — used as the
// case-insensitive, extra-space-insensitive key for matching a typed name
// against a class list's registered name.
function normalizeName(s){ return (s||'').trim().replace(/\s+/g,' ').toLowerCase(); }
function normalizeField(s){ return (s||'').trim().replace(/\s+/g,' '); }
// Deterministic Firestore doc ID for a teacher's class roster: every test
// with the same owner + assignedClass shares one roster, computed the same
// way client-side and in firestore.rules (no lookup/query needed).
function rosterIdFor(ownerId, className){ return ownerId+'__'+className; }

/* ---------------- Firebase (required) ----------------
   TestLink is now a server-backed app: every teacher signs in, and every
   test, question-bank item, submission, and result lives in Firestore —
   nothing persistent is kept in localStorage or embedded in URLs anymore.
   Paste your project's config below (see SETUP.md) before hosting this. */
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBZMcfQ-7m6QRaHzxJXBKfiOsYoS1ddLDs",
  authDomain: "testlink-4bec5.firebaseapp.com",
  projectId: "testlink-4bec5",
  storageBucket: "testlink-4bec5.firebasestorage.app",
  messagingSenderId: "630221369903",
  appId: "1:630221369903:web:dd9a48361c680f44c78cda",
  measurementId: "G-9WC9NCWF2N"
};
const FIREBASE_ENABLED = !!(firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PASTE'));
let auth=null, dbf=null, currentUser=null, authReady=false;
if(FIREBASE_ENABLED){
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  dbf = firebase.firestore();
}

/* ---------------- storage ----------------
   localCache is a read-through, in-memory mirror of Firestore — every
   view reads it synchronously via getDB() for simplicity, but it holds
   no data of its own: Firestore onSnapshot listeners populate it after
   sign-in, and every write goes straight to Firestore. Close the tab,
   clear the browser, or open a different device and log in again — the
   data is exactly as you left it, because none of it ever lived here. */
let localCache = {tests:{}, results:{}, bank:[], unfinished:{}};
function getDB(){ return localCache; }

function saveTest(test){
  localCache.tests[test.id]=test; // full version (with answers) stays in the teacher's own memory/UI
  const isPublished = test.status==='published';
  // "Hidden" result-visibility tests get the stronger security treatment:
  // the answer key never reaches a student's browser at all, so grading
  // has to happen later, in the teacher's own authenticated session (see
  // subscribeResults/gradeAttempt below). Immediate/scoreOnly tests keep
  // the existing tradeoff — the key travels with the test so the
  // student's own browser can grade it instantly on submit.
  const hideResults = isPublished && test.config.resultVisibility === 'hidden';
  const publicQuestions = test.questions.map(q=>{
    if(!hideResults) return q;
    const {correct, numericMin, numericMax, ...rest} = q; return rest;
  });
  const publicDoc = {...test, ownerId: currentUser.uid, questions: publicQuestions};
  dbf.collection('tests').doc(test.id).set(publicDoc)
    .catch(err=>toast('Could not save to the server: '+err.message));
  if(hideResults){
    const answerKey={};
    test.questions.forEach(q=>{
      answerKey[q.id] = { correct: q.correct||[], numericMin: q.numericMin!=null? q.numericMin:null, numericMax: q.numericMax!=null? q.numericMax:null };
    });
    dbf.collection('tests').doc(test.id).collection('private').doc('answerKey').set(answerKey).catch(()=>{});
  }
}
// When opening a "hidden"-visibility published test for editing, the synced
// copy has had its answer key stripped (see saveTest above) — pull it back
// from the owner-only private subcollection so the verify/edit screens work.
async function loadTestForEdit(testId){
  let test = getDB().tests[testId];
  if(!test) return null;
  const missingAnswers = test.questions.length && test.questions.some(q=>q.correct===undefined);
  if(missingAnswers){
    try{
      const keyDoc = await dbf.collection('tests').doc(testId).collection('private').doc('answerKey').get();
      test = JSON.parse(JSON.stringify(test));
      const key = keyDoc.exists? keyDoc.data() : {};
      test.questions.forEach(q=>{
        const entry = key[q.id];
        if(Array.isArray(entry)){ // legacy key format, from before numerical questions existed
          q.correct = entry;
          if(q.numericMin===undefined) q.numericMin=null;
          if(q.numericMax===undefined) q.numericMax=null;
        } else {
          q.correct = (entry && entry.correct) || [];
          q.numericMin = (entry && entry.numericMin!=null) ? entry.numericMin : (q.numericMin!=null? q.numericMin:null);
          q.numericMax = (entry && entry.numericMax!=null) ? entry.numericMax : (q.numericMax!=null? q.numericMax:null);
        }
      });
    }catch(e){ toast('Could not load answer key: '+e.message); }
  }
  return test;
}
function deleteTest(id){
  delete localCache.tests[id]; delete localCache.results[id];
  dbf.collection('tests').doc(id).delete().catch(()=>{});
}
function subscribeTeacherData(){
  if(window._unsubTests) window._unsubTests();
  window._unsubTests = dbf.collection('tests').where('ownerId','==',currentUser.uid)
    .onSnapshot(snap=>{
      const tests={};
      snap.forEach(doc=>{ const d=doc.data(); d.id=doc.id; tests[doc.id]=d; });
      localCache.tests=tests;
      render();
    }, err=>toast('Sync error: '+err.message));
}
let answerKeyCache = {}; // testId -> {qid: [correctOptionIds]}, fetched lazily — only ever needed for "hidden" tests
async function ensureAnswerKey(testId){
  if(answerKeyCache[testId]) return answerKeyCache[testId];
  try{
    const doc = await dbf.collection('tests').doc(testId).collection('private').doc('answerKey').get();
    answerKeyCache[testId] = doc.exists? doc.data() : {};
  }catch(e){ answerKeyCache[testId] = {}; }
  return answerKeyCache[testId];
}
/** Grades one attempt against the test's own questions (if they carry
    `correct` already) or a separately-fetched answer key (for "hidden"
    tests, where the student's browser never had the key to begin with —
    this is where that deferred grading actually happens). */
/** Works for every question type, and for both places grading happens:
    directly on a question that still carries its own answer key (q.correct
    / q.numericMin/Max — the immediate/scoreOnly path), or against a
    separately-fetched private key entry (the "hidden"-visibility path).
    keyEntry may be the older flat-array format (legacy hidden-mode tests
    published before numerical/multi-select support existed) or the newer
    {correct, numericMin, numericMax} object — both are handled. */
function isAnswerCorrect(q, given, keyEntry){
  if(!given || given.length===0) return null; // unattempted
  if(q.type==='numerical'){
    let min = q.numericMin, max = q.numericMax;
    if(min==null && keyEntry && typeof keyEntry==='object' && !Array.isArray(keyEntry)){
      min = keyEntry.numericMin; max = keyEntry.numericMax;
    }
    const val = parseFloat(given[0]);
    if(isNaN(val) || min==null || max==null) return false;
    return val>=min && val<=max;
  }
  let correctIds = q.correct;
  if(correctIds===undefined){
    if(Array.isArray(keyEntry)) correctIds = keyEntry; // legacy hidden-mode key format
    else if(keyEntry && typeof keyEntry==='object') correctIds = keyEntry.correct || [];
    else correctIds = [];
  }
  const correct = new Set(correctIds||[]);
  const givenSet = new Set(given);
  return correct.size===givenSet.size && [...correct].every(c=>givenSet.has(c));
}
/** Resolves the correct option ids for display, whether they live
    directly on the question (immediate/scoreOnly tests, or the teacher's
    own always-unstripped copy) or only in a separately-fetched key entry
    (hidden-mode tests, viewed by the teacher). Returns null when truly
    unknown — e.g. an in-progress attempt on a hidden test the teacher
    hasn't opened Results for yet, so nothing has been fetched. */
function resolveCorrectIds(q, keyEntry){
  if(q.correct!==undefined) return q.correct||[];
  if(Array.isArray(keyEntry)) return keyEntry; // legacy hidden-mode key format
  if(keyEntry && typeof keyEntry==='object') return keyEntry.correct||[];
  return null;
}
function resolveNumericRange(q, keyEntry){
  if(q.numericMin!=null) return {min:q.numericMin, max:q.numericMax};
  if(keyEntry && typeof keyEntry==='object' && !Array.isArray(keyEntry) && keyEntry.numericMin!=null){
    return {min:keyEntry.numericMin, max:keyEntry.numericMax};
  }
  return {min:null, max:null};
}
/** One question's review card — question text, image, and either the
    option-by-option correct/incorrect breakdown or the numerical answer
    vs. accepted range. Shared by the teacher's response modal, the
    student's own post-submission review, and the unfinished-attempt
    progress viewer, so all three stay visually and behaviorally
    consistent instead of drifting apart as separate copies. */
function renderQuestionReviewCard(q, index, given, wasCorrect, keyEntry){
  given = given || [];
  const statusBadge = wasCorrect===true? '<span class="badge verified">Correct</span>'
    : wasCorrect===false? '<span class="badge review">Incorrect</span>'
    : (given.length? '' : '<span class="badge draft">Unattempted</span>');
  const imageHtml = q.image? `<img src="${q.image}" style="max-width:100%; border-radius:4px; margin:8px 0;">` : '';
  let body;
  if(q.type==='numerical'){
    const range = resolveNumericRange(q, keyEntry);
    const rangeKnown = range.min!=null && range.max!=null;
    const rangeText = rangeKnown ? (range.min===range.max? `Correct answer: ${range.min}` : `Accepted range: ${range.min} to ${range.max}`) : 'Correct answer not available';
    body = `<div class="small" style="margin-top:6px;">
      <div>Answer given: <strong>${given.length? esc(given[0]) : '—'}</strong></div>
      <div class="muted">${esc(rangeText)}</div>
    </div>`;
  } else {
    const correctIds = resolveCorrectIds(q, keyEntry);
    body = (q.options||[]).map(o=>{
      const wasGiven = given.includes(o.id);
      const isCorrect = correctIds ? correctIds.includes(o.id) : false;
      let style='';
      if(correctIds && isCorrect) style='color:var(--green); font-weight:600;';
      else if(wasGiven && correctIds && !isCorrect) style='color:var(--red); text-decoration:line-through;';
      const markBg = (correctIds && isCorrect) ? 'background:var(--green);border-color:var(--green);color:#fff;'
        : (wasGiven && correctIds) ? 'background:var(--red);border-color:var(--red);color:#fff;'
        : wasGiven ? 'background:var(--ink);border-color:var(--ink);color:#fff;' : '';
      return `<div class="opt" style="${style}"><span class="oletter" style="${markBg}">${wasGiven?'●':''}</span>${esc(o.text)}</div>`;
    }).join('');
  }
  return `
    <div class="qcard" style="margin-bottom:10px;">
      <div class="qhead"><span class="qnum">Q${index+1} · ${typeLabelShort(q.type)}</span>${statusBadge}</div>
      <div class="qtext" style="font-size:14px;">${esc(q.text)}</div>
      ${imageHtml}
      ${body}
    </div>`;
}
/** The single definition of an attempt's display status, shared by the
    Results/Unfinished-Attempts view and the Classes page so both always
    agree. Firestore only ever stores 'in-progress', 'submitted', or (once
    a teacher resets one) 'invalidated' — "In Progress" vs. "Expired/Time
    Up" is derived here, purely from data already on the attempt: once its
    own fixed time allowance has elapsed without a submission, the student
    is gone and it will never complete on its own. Reconnecting or a
    teacher opening Results never changes this and never grants extra time. */
function deriveAttemptStatus(a, now){
  if(a.status==='submitted') return 'Submitted';
  if(a.status==='invalidated') return 'Reset/Invalidated';
  return (now - a.startedAt > a.availableMs) ? 'Expired/Time Up' : 'In Progress';
}
function gradeAttempt(test, key, a){
  let score=0, maxScore=0, correctCount=0, incorrectCount=0, unattempted=0, negativeDeduction=0;
  const perQuestionCorrect={};
  test.questions.forEach(q=>{
    maxScore += q.marks;
    const given = a.answers[q.id] || [];
    const isCorrect = isAnswerCorrect(q, given, key[q.id]);
    if(isCorrect===null){ unattempted++; return; }
    perQuestionCorrect[q.id]=isCorrect;
    if(isCorrect){ score+=q.marks; correctCount++; }
    else{
      incorrectCount++;
      const neg = test.config.negativeMarking? (q.negativeMarks||test.config.negativeValue):0;
      negativeDeduction += neg; score -= neg;
    }
  });
  score = Math.max(0, score);
  const percentage = maxScore? (score/maxScore*100):0;
  return {...a, perQuestionCorrect, score:Math.round(score*100)/100, maxScore, correctCount, incorrectCount, unattempted, negativeDeduction:Math.round(negativeDeduction*100)/100, percentage};
}
// A "result" is a submitted attempt. For immediate/scoreOnly tests, the
// student's own browser already computed the score at submission time —
// this just reads it. For "hidden" tests, submitted attempts carry raw
// answers only (no score fields), so grading happens right here, in the
// teacher's own authenticated browser, against the privately-stored key.
function subscribeResults(testId){
  if(window._unsubResults) window._unsubResults();
  window._unsubResults = dbf.collection('tests').doc(testId).collection('attempts')
    .onSnapshot(async snap=>{
      const submitted=[]; const unfinished=[];
      snap.forEach(d=>{
        const a=d.data(); a.id=d.id;
        if(a.status==='submitted') submitted.push(a); else unfinished.push(a);
      });
      const test = getDB().tests[testId];
      const needsGrading = test && submitted.some(a=>typeof a.percentage!=='number');
      const key = needsGrading ? await ensureAnswerKey(testId) : {};
      localCache.results[testId] = !test ? submitted
        : submitted.map(a=> typeof a.percentage==='number' ? a : gradeAttempt(test, key, a));
      localCache.unfinished[testId] = unfinished;
      if(location.hash===`#/results/${testId}`) render();
    }, err=>toast('Sync error: '+err.message));
}

   Reusable questions, saved once and pulled into any future test — its

function subscribeBank(){

}
function addToBank(q){
  if(!q) return;
  if(q.bankId){ toast('Already saved to your bank'); return; } // guards against accidental duplicate saves
  const item = {
    ownerId: currentUser.uid,
    text: q.text, type: q.type||'single', options: q.options, correct: q.correct,
    numericMin: q.numericMin!=null? q.numericMin : null, numericMax: q.numericMax!=null? q.numericMax : null,
    image: q.image || null,
    marks: q.marks, negativeMarks: q.negativeMarks, createdAt: Date.now()

  dbf.collection('questionBank').add(item)

      q.bankId = ref.id;

}
function deleteBankItem(id){
  if(!confirm('Remove this question from your bank?')) return;
  dbf.collection('questionBank').doc(id).delete().catch(err=>toast('Could not delete: '+err.message));
}

/* ---------------- question paper parser ---------------- */
// Best-effort text parser: finds "1. question", options "A) text", "Answer: B"
// — plus, for a question with no lettered options at all, a numeric
// answer line like "Answer: 34-37" (a range) or "Answer: 5" (an exact
// value) is read as a numerical-input question instead.
function parseQuestionPaper(raw){
  const lines = raw.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  const qRe = /^(?:Q\.?\s*)?(\d{1,3})[\.\)\:]\s+(.*)/i;
  const oRe = /^\(?([A-Da-d])\)?[\.\)\:]\s+(.*)/;
  const aRe = /^(?:Ans(?:wer)?|Correct\s*Answer)\s*[:\-]?\s*\(?([A-Da-d])\)?/i;
  const numRangeRe = /^(?:Ans(?:wer)?|Correct\s*Answer)\s*[:\-]?\s*(-?\d+(?:\.\d+)?)\s*(?:-|to|–|—)\s*(-?\d+(?:\.\d+)?)\s*$/i;
  const numExactRe = /^(?:Ans(?:wer)?|Correct\s*Answer)\s*[:\-]?\s*(-?\d+(?:\.\d+)?)\s*$/i;
  let questions=[]; let cur=null;
  for(const line of lines){
    const qm = line.match(qRe);
    const om = line.match(oRe);
    const am = line.match(aRe);
    // Numeric answer lines only make sense for a question that hasn't
    // collected any lettered options — otherwise it's clearly an MCQ.
    const canBeNumeric = cur && cur.options.length===0 && cur.numericMin==null;
    const nrm = canBeNumeric ? line.match(numRangeRe) : null;
    const nem = (canBeNumeric && !nrm) ? line.match(numExactRe) : null;

    if(qm && (!cur || cur.options.length>0 || cur.numericMin!=null || cur.text==='')){
      if(cur) questions.push(cur);
      cur = {text: qm[2], options: [], answerLetter:null, numericMin:null, numericMax:null};
      continue;
    }
    if(om && cur){
      cur.options.push(om[2]);
      continue;
    }
    if(am && cur){
      cur.answerLetter = am[1].toUpperCase();
      continue;
    }
    if(nrm && cur){
      cur.numericMin = parseFloat(nrm[1]); cur.numericMax = parseFloat(nrm[2]);
      continue;
    }
    if(nem && cur){
      const v = parseFloat(nem[1]); cur.numericMin = v; cur.numericMax = v;
      continue;
    }
    if(cur && cur.options.length===0 && cur.numericMin==null){
      cur.text += ' ' + line; // wrap multi-line question text
    }
  }
  if(cur) questions.push(cur);

  return questions.map(q=>{
    if(q.numericMin!=null){
      const lowConfidence = q.numericMax==null;
      return {
        id: uid('q'), text: q.text.trim(), type:'numerical',
        options: [], correct: [],
        numericMin: q.numericMin, numericMax: q.numericMax!=null? q.numericMax : q.numericMin,
        image: null, marks: 1, negativeMarks: 0, status:'review', lowConfidence
      };
    }
    const opts = q.options.map((t,i)=>({id: 'o'+i, text:t}));
    let correct = [];
    if(q.answerLetter){
      const idx = q.answerLetter.charCodeAt(0)-65;
      if(opts[idx]) correct=[opts[idx].id];
    }
    const isTrueFalse = opts.length===2 && opts.every(o=>/^(true|false)$/i.test(o.text.trim()));
    const lowConfidence = opts.length<2 || correct.length===0;
    return {
      id: uid('q'),
      text: q.text.trim(),
      type: isTrueFalse? 'truefalse' : 'single',
      options: opts.length? opts : [{id:'o0',text:'Option A'},{id:'o1',text:'Option B'}],
      correct: correct.length? correct : [],
      numericMin: null, numericMax: null, image: null,
      marks: 1,
      negativeMarks: 0,
      status: 'review' // teacher must verify everything, low-confidence flagged separately
      , lowConfidence
    };
  });
}

/* ---------------- app state / router ---------------- */
let wizardDraft = null; // in-memory test being created/edited
let attemptState = null; // in-memory current student attempt

function render(){
  const hash = location.hash || '#/dashboard';
  const app = document.getElementById('app');

  // The Results page's listener re-reads on every change to any attempt in
  // that test (including every student's 30s heartbeat) — cheap while the
  // teacher is actually looking at it, wasteful once they've navigated
  // away and it's just idling in the background. Tear it down immediately
  // whenever the route isn't Results; subscribeResults() re-creates it
  // the moment they open a results page again.
  if(!hash.startsWith('#/results/') && window._unsubResults){
    window._unsubResults();
    window._unsubResults = null;
  }

  if(!FIREBASE_ENABLED){
    app.innerHTML = `
      <div class="topbar"><div class="brand"><span class="mark">T</span><span class="name">TestLink</span></div></div>
      <div class="shell"><div class="authshell card pad">
        <h2 style="margin-bottom:8px;">Server setup required</h2>
        <p class="muted small">This deployment hasn't been connected to a Firebase project yet, so there's nowhere to store accounts, tests, or results. Paste a real <span class="mono">firebaseConfig</span> near the top of <span class="mono">index.html</span> and reload — see SETUP.md for the exact steps.</p>
      </div></div>`;
    return;
  }

  if(hash.startsWith('#/attempt')){
    app.innerHTML = renderAttemptShell();
    mountAttempt(hash);
    return;
  }

  if(!authReady){
    app.innerHTML = `<div class="fullload"><span class="spinner"></span>Loading…</div>`;
    return;
  }
  if(!currentUser){
    app.innerHTML = `
      <div class="topbar">
        <div class="brand"><span class="mark">T</span><span class="name">TestLink</span></div>
      </div>
      <div class="shell"><div class="authshell">${renderAuthGate()}</div></div>`;
    return;
  }

  if(hash.startsWith('#/preview/')){
    const tid = hash.split('/')[2];
    app.innerHTML = `
      <div style="position:sticky; top:0; z-index:20; background:var(--amber-soft); border-bottom:2px solid var(--amber); padding:10px 20px; display:flex; justify-content:space-between; align-items:center;">
        <span><strong style="color:var(--amber);">PREVIEW MODE</strong> — nothing here is saved, timed against the server, or counted as a real attempt.</span>
        <button class="btn secondary small" onclick="location.hash='#/edit/${tid}'">Exit Preview</button>
      </div>
      <div class="examshell" id="examshell"></div>`;
    mountPreview(tid);
    return;
  }

  // teacher area: shared topbar
  let body='';
  let route='dashboard';
  if(hash.startsWith('#/create')) { body=viewWizard(); route='create'; }
  else if(hash.startsWith('#/bank')) { body=viewBank(); route='bank'; }
  else if(hash.startsWith('#/classes/')) {
    const cls = decodeURIComponent(hash.slice('#/classes/'.length));
    const cp = classPageCache[cls];
    if(!cp){
      if(!classPageLoading.has(cls)) loadClassPage(cls);
      body = `<div class="fullload"><span class="spinner"></span>Loading ${esc(cls)}…</div>`;
    } else {
      body = viewClassDetail(cls);
    }
    route='classes';
  }
  else if(hash.startsWith('#/classes')) {
    if(!classesIndexLoaded){
      if(!window._classesIndexLoading) loadClassesIndex();
      body = `<div class="fullload"><span class="spinner"></span>Loading classes…</div>`;
    } else {
      body = viewClasses();
    }
    route='classes';
  }
  else if(hash.startsWith('#/results/')) {
    const tid=hash.split('/')[2];
    subscribeResults(tid);
    body=viewResults(tid); route='dashboard';
  }
  else if(hash.startsWith('#/edit/')) {
    const tid = hash.split('/')[2];
    const cached = getDB().tests[tid];
    const ready = cached && (!cached.questions.length || cached.questions.every(q=>q.correct!==undefined));
    if(ready){
      wizardDraft = cached; body=viewWizard(); route='create';
    } else if(cached) {
      loadTestForEdit(tid).then(t=>{ wizardDraft=t; render(); });
      body = `<div class="fullload"><span class="spinner"></span>Loading test…</div>`; route='create';
    } else {
      body = `<div class="empty card"><h3>Test not found</h3></div>`;
    }
  }
  else { body=viewDashboard(); route='dashboard'; }

  app.innerHTML = `
    <div class="topbar">
      <div class="brand" onclick="location.hash='#/dashboard'">
        <span class="mark">T</span>
        <span class="name">TestLink</span>
        <span class="tag">&nbsp;· teacher console</span>
      </div>
      <div class="topnav">
        <span class="synctag online">● saved to your account</span>
        <span class="${route==='dashboard'?'active':''}" onclick="location.hash='#/dashboard'">Dashboard</span>
        <span class="${route==='create'?'active':''}" onclick="startNewTest()">Create Test</span>
        <span class="${route==='bank'?'active':''}" onclick="location.hash='#/bank'">Question Bank</span>
        <span class="${route==='classes'?'active':''}" onclick="location.hash='#/classes'">Classes</span>
        <span onclick="doLogout()">Sign out (${esc(currentUser.email)})</span>
      </div>
    </div>
    <div class="shell wide">${body}</div>
  `;
  wireDashboardEvents();
  if(route==='create') afterWizardRender();
}

/* ============================================================
   CLASSES
   Tests are grouped by their existing meta.assignedClass field.
   A class's roster ("class list") lives at
   classRosters/{ownerUid}__{className}/students/{canonicalMobile} — one
   small doc per student, never one big spreadsheet blob (Spark-friendly:
   no document ever grows with the class, and Firestore's 1MiB/doc cap
   never comes into play here).

   Everything on this page is fetched with one-time .get() calls, never
   onSnapshot listeners — a teacher browsing Classes shouldn't hold open a
   dozen live listeners (one per test, ticking on every heartbeat) that
   just idle in the background. Refresh buttons re-fetch on demand.
   ============================================================ */
let classesIndex = {};         // className -> {studentCount}
let classesIndexLoaded = false;
let classPageCache = {};       // className -> {students, tests, attempts, fetchedAt} | {error}
let classPageLoading = new Set();
let classListImport = {};      // className -> {rows, mode, fileName}

/** One-time fetch of everything a class page needs: the roster (registered
    students), the tests assigned to this class (already in the realtime-
    synced local cache — no extra read), and every attempt across those
    tests (one .get() per test's attempts subcollection). Hidden-visibility
    tests with ungraded submissions are graded here too, exactly like
    subscribeResults() does, so "Average/highest score" and "Pass %" are
    correct regardless of a test's result-visibility setting. */
async function loadClassPage(className){
  if(classPageLoading.has(className)) return;
  classPageLoading.add(className);
  try{
    const uidv = currentUser.uid;
    const rid = rosterIdFor(uidv, className);
    const studentsSnap = await dbf.collection('classRosters').doc(rid).collection('students').get();
    const students = studentsSnap.docs.map(d=>({id:d.id, ...d.data()}));

    const tests = Object.values(getDB().tests).filter(t=>(t.meta.assignedClass||'')===className);

    const attempts = [];
    for(const t of tests){
      const snap = await dbf.collection('tests').doc(t.id).collection('attempts').get();
      snap.forEach(d=>{ const a=d.data(); a.id=d.id; a._testId=t.id; a._testName=t.meta.name; attempts.push(a); });
    }
    for(const t of tests){
      const needGrading = attempts.filter(a=>a._testId===t.id && a.status==='submitted' && typeof a.percentage!=='number');
      if(needGrading.length){
        const key = await ensureAnswerKey(t.id);
        needGrading.forEach(a=>Object.assign(a, gradeAttempt(t, key, a)));
      }
    }
    classPageCache[className] = { students, tests, attempts, fetchedAt: Date.now() };
  }catch(err){
    classPageCache[className] = { error: err.message, students:[], tests:[], attempts:[], fetchedAt: Date.now() };
  }
  classPageLoading.delete(className);
  render();
}
function refreshClassPage(className){ delete classPageCache[className]; render(); }

/** Statistic definitions (all computed client-side over the one-time
    fetch in loadClassPage):
    - Active participants: distinct registered students with an attempt
      currently "In Progress" (started, not yet submitted, time not yet up).
    - Submitted / In Progress / Expired-Time-Up / Reset-Invalidated:
      deriveAttemptStatus() applied to every attempt across this class's tests.
    - Average/Highest score, Pass rate: over graded submitted attempts only
      ("hidden" tests are graded on the fly, see loadClassPage).
    - Most missed: the registered student(s) who did NOT submit the largest
      number of this class's *published* tests.
    - Best/most consistent: the student with the highest average percentage
      across their own submissions; ties broken by the lowest spread
      (standard deviation) across those submissions, then by more submissions.
    All per-student aggregation is keyed by the class list's canonical
    10-digit mobile number, never by the free-text name typed into an
    attempt — so a typo or case difference in an attempt can't split one
    student into two, or merge two different students together. */
function computeClassStats(className){
  const cp = classPageCache[className];
  const now = Date.now();
  const rosterByMobile = {};
  cp.students.forEach(s=>{ rosterByMobile[s.id]=s; });

  const withStatus = cp.attempts.map(a=>({
    ...a, _status: deriveAttemptStatus(a, now),
    _mobile: canonicalMobile10(a.student && a.student.mobile)
  }));
  const submitted = withStatus.filter(a=>a._status==='Submitted');
  const inProgress = withStatus.filter(a=>a._status==='In Progress');
  const expired = withStatus.filter(a=>a._status==='Expired/Time Up');
  const reset = withStatus.filter(a=>a._status==='Reset/Invalidated');
  const activeParticipants = new Set(inProgress.map(a=>a._mobile || a.id)).size;

  const graded = submitted.filter(a=>typeof a.percentage==='number');
  const avgScore = graded.length ? graded.reduce((s,a)=>s+a.percentage,0)/graded.length : null;
  const highestScore = graded.length ? Math.max(...graded.map(a=>a.percentage)) : null;
  const passCount = graded.filter(a=>{
    const t = cp.tests.find(x=>x.id===a._testId);
    return t ? a.percentage >= t.config.passPercent : false;
  }).length;
  const passPct = graded.length ? (passCount/graded.length*100) : null;

  const perStudent = {};
  graded.forEach(a=>{
    const mob = a._mobile; if(!mob) return;
    const roster = rosterByMobile[mob];
    const name = roster ? roster.name : ((a.student && a.student.name) || 'Unknown');
    if(!perStudent[mob]) perStudent[mob] = {mobile:mob, name, scores:[], testIds:new Set()};
    perStudent[mob].scores.push(a.percentage);
    perStudent[mob].testIds.add(a._testId);
  });

  const publishedTests = cp.tests.filter(t=>t.status==='published');
  let mostMissed = [];
  if(publishedTests.length && cp.students.length){
    const missedList = cp.students.map(s=>{
      const doneIds = perStudent[s.id] ? perStudent[s.id].testIds : new Set();
      return { name:s.name, mobile:s.id, missed: publishedTests.filter(t=>!doneIds.has(t.id)).length };
    });
    const maxMissed = Math.max(0, ...missedList.map(m=>m.missed));
    if(maxMissed>0) mostMissed = missedList.filter(m=>m.missed===maxMissed);
  }

  let best = null;
  Object.values(perStudent).forEach(p=>{
    const avg = p.scores.reduce((a,b)=>a+b,0)/p.scores.length;
    const variance = p.scores.length>1 ? p.scores.reduce((s,v)=>s+Math.pow(v-avg,2),0)/p.scores.length : 0;
    const stddev = Math.sqrt(variance);
    const cand = {name:p.name, mobile:p.mobile, avg, stddev, count:p.scores.length};
    if(!best || cand.avg>best.avg || (cand.avg===best.avg && cand.stddev<best.stddev) || (cand.avg===best.avg && cand.stddev===best.stddev && cand.count>best.count)) best=cand;
  });

  const events = [];
  withStatus.forEach(a=>{
    const roster = rosterByMobile[a._mobile];
    const name = roster ? roster.name : ((a.student && a.student.name) || 'Unknown');
    events.push({ts:a.startedAt, type:'started', name, testName:a._testName});
    if(a.status==='submitted') events.push({ts:(a.submittedAt||a.startedAt), type:'submitted', name, testName:a._testName});
  });
  events.sort((x,y)=>y.ts-x.ts);

  return {
    counts:{ submitted:submitted.length, inProgress:inProgress.length, expired:expired.length, reset:reset.length },
    activeParticipants, avgScore, highestScore, passPct,
    mostMissed, best, recentActivity: events.slice(0,15),
    registeredCount: cp.students.length, publishedTestsCount: publishedTests.length
  };
}

function findField(row, candidates){
  const keys = Object.keys(row);
  for(const k of keys){
    const nk = k.trim().toLowerCase().replace(/\s+/g,' ');
    if(candidates.includes(nk)) return row[k];
  }
  return '';
}
/** Parses + validates every row from the uploaded sheet, but writes
    nothing yet — see importClassList() for the actual Firestore writes,
    which only run once the teacher reviews this preview and confirms. */
function validateClassListRows(raw, className){
  const rows = raw.map((r,i)=>{
    const name = normalizeField(String(findField(r, ['name','student name','full name'])||''));
    const cls = normalizeField(String(findField(r, ['class'])||''));
    const roll = normalizeField(String(findField(r, ['roll number','roll no','roll no.','roll'])||''));
    const mobileRaw = String(findField(r, ['mobile number','mobile','mobile no','mobile no.','phone','phone number'])||'');
    const canonical = canonicalMobile10(mobileRaw);
    const issues = [];
    if(!name) issues.push('Missing name');
    if(!cls) issues.push('Missing class');
    else if(normalizeField(cls).toLowerCase()!==normalizeField(className).toLowerCase()) issues.push(`Class mismatch (expected ${className})`);
    if(!roll) issues.push('Missing roll number');
    if(!canonical) issues.push('Invalid or non-10-digit mobile number');
    return { row:i+2, name, class:cls, roll, mobileRaw, mobile:canonical, normalizedName:normalizeName(name), issues };
  });
  const firstSeenAt = {};
  rows.forEach((r,i)=>{
    if(!r.mobile) return;
    if(firstSeenAt[r.mobile]===undefined) firstSeenAt[r.mobile]=i;
    else{
      r.issues.push('Duplicate mobile number');
      rows[firstSeenAt[r.mobile]].issues.push('Duplicate mobile number');
    }
  });
  rows.forEach(r=>{ r.issues = [...new Set(r.issues)]; });
  return rows;
}
function handleClassListFile(file, className){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(!raw.length){ toast('That sheet has no data rows.'); return; }
      const rows = validateClassListRows(raw, className);
      classListImport[className] = { rows, mode:'merge', fileName:file.name };
      render();
    }catch(err){ toast('Could not read that file: '+err.message); }
  };
  reader.readAsArrayBuffer(file);
}

/** Writes only to classRosters/{rosterId}/students — never touches
    tests, attempts, or mobileClaims, so importing (in either mode) can
    never delete an attempt, a result, or reset an attempt-count counter. */
async function importClassList(className){
  const imp = classListImport[className];
  if(!imp) return;
  const valid = imp.rows.filter(r=>r.issues.length===0);
  if(!valid.length) return;
  const uidv = currentUser.uid;
  const rid = rosterIdFor(uidv, className);
  const rosterRef = dbf.collection('classRosters').doc(rid);
  const studentsRef = rosterRef.collection('students');

  toast('Importing…');
  try{
    const cp = classPageCache[className] || {students:[], tests:[], attempts:[]};
    let newStudents;
    if(imp.mode==='replace'){
      newStudents = valid.map(r=>({id:r.mobile, name:r.name, class:className, roll:r.roll, normalizedName:r.normalizedName}));
    } else {
      const byMobile = {}; (cp.students||[]).forEach(s=>{ byMobile[s.id]=s; });
      valid.forEach(r=>{ byMobile[r.mobile] = {id:r.mobile, name:r.name, class:className, roll:r.roll, normalizedName:r.normalizedName}; });
      newStudents = Object.values(byMobile);
    }

    // The roster PARENT doc must exist before any write to its students
    // subcollection (firestore.rules checks ownership via that parent) —
    // so this always runs first, including on a class's very first-ever
    // import, when this .set() is what creates classRosters/{rid} at all.
    await rosterRef.set({ ownerId:uidv, className, studentCount:newStudents.length, updatedAt:Date.now() }, {merge:true});

    if(imp.mode==='replace'){
      const existing = await studentsRef.get();
      const keep = new Set(valid.map(r=>r.mobile));
      const toDelete = existing.docs.filter(d=>!keep.has(d.id));
      for(let i=0;i<toDelete.length;i+=400){
        const batch = dbf.batch();
        toDelete.slice(i,i+400).forEach(d=>batch.delete(d.ref));
        await batch.commit();
      }
    }
    for(let i=0;i<valid.length;i+=400){
      const batch = dbf.batch();
      valid.slice(i,i+400).forEach(r=>{
        batch.set(studentsRef.doc(r.mobile), {
          name:r.name, class:className, roll:r.roll,
          normalizedName:r.normalizedName, updatedAt:Date.now()
        }, {merge:true});
      });
      await batch.commit();
    }

    classPageCache[className] = {...cp, students:newStudents};
    classesIndex[className] = { studentCount:newStudents.length };
    delete classListImport[className];
    toast('Class list imported');
    render();
  }catch(err){ toast('Import failed: '+err.message); }
}
async function removeClassListStudent(className, mobile){
  if(!confirm('Remove this student from the class list? This does not delete any test attempts, results, or attempt counters.')) return;
  const uidv = currentUser.uid;
  const rid = rosterIdFor(uidv, className);
  try{
    await dbf.collection('classRosters').doc(rid).collection('students').doc(mobile).delete();
    const cp = classPageCache[className];
    const newStudents = cp.students.filter(s=>s.id!==mobile);
    await dbf.collection('classRosters').doc(rid).set({studentCount:newStudents.length, updatedAt:Date.now()}, {merge:true});
    classPageCache[className] = {...cp, students:newStudents};
    classesIndex[className] = { studentCount:newStudents.length };
    toast('Removed');
    render();
  }catch(err){ toast('Could not remove: '+err.message); }
}

let wizardStep = 'upload'; // upload -> verify -> configure -> preview
/* ---------------- Firestore document-size safety check ----------------
   Firestore hard-caps a single document at 1 MiB. Every question in a
   test — including any attached image, base64-encoded — lives inside
   one "tests/{id}" document, so a test with a few uncompressed images
   can realistically approach that ceiling. This estimates the size the
   same way it'll actually be sent (JSON, measured in real bytes via
   Blob, not JS string length which undercounts multi-byte characters)
   so teachers see it coming instead of hitting an opaque write failure. */
const FIRESTORE_DOC_LIMIT = 1048576; // 1 MiB, Firestore's actual per-document cap
function estimateTestSizeBytes(test){
  try{ return new Blob([JSON.stringify(test)]).size; }
  catch(e){ return 0; }
}
function testSizeStatus(bytes){
  if(bytes >= FIRESTORE_DOC_LIMIT) return 'over';
  if(bytes >= 950*1024) return 'critical';
  if(bytes >= 800*1024) return 'warning';
  return 'ok';
}
function fmtBytes(n){
  if(n < 1024) return n+' B';
  if(n < 1024*1024) return (n/1024).toFixed(0)+' KB';
  return (n/(1024*1024)).toFixed(2)+' MiB';
}
function renderSizeIndicator(){
  const bytes = estimateTestSizeBytes(wizardDraft);
  const status = testSizeStatus(bytes);
  const pct = Math.min(100, (bytes/FIRESTORE_DOC_LIMIT)*100);
  const colors = {ok:'var(--green)', warning:'var(--amber)', critical:'#C1531B', over:'var(--red)'};
  const labels = {ok:'OK', warning:'Getting large', critical:'Critical — close to limit', over:'Over limit — will not save'};
  return `
    <div class="card pad" style="margin-bottom:16px; padding:11px 16px;">
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span class="small">Document size (approximate): <strong>${fmtBytes(bytes)}</strong> / 1 MiB</span>
        <span class="small" style="color:${colors[status]}; font-weight:700;">${labels[status]}</span>
      </div>
      <div style="height:6px; background:var(--paper-line); border-radius:3px; overflow:hidden;">
        <div style="height:100%; width:${pct}%; background:${colors[status]};"></div>
      </div>
      ${status==='over'? `<p class="small" style="color:var(--red); margin:8px 0 0;">This test is too large to save — Firestore caps a single document at 1 MiB. Remove or further compress an image in Verify to continue; nothing past this point will save to the server until it's back under the limit.</p>` : ''}
      ${status==='critical'? `<p class="small muted" style="margin:8px 0 0;">Close to Firestore's 1 MiB document limit — consider removing or compressing an image soon.</p>` : ''}
    </div>`;
}
function viewWizard(){
  if(!wizardDraft) wizardDraft = newTest();
  const steps=[['upload','1. Upload'],['verify','2. Verify'],['configure','3. Configure'],['preview','4. Publish']];
  return `
    <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:4px;">
      <input type="text" value="${esc(wizardDraft.meta.name)}" style="font-family:'Source Serif 4',serif; font-size:20px; font-weight:700; border:none; background:transparent; padding:4px 0; max-width:480px;"
        onchange="wizardDraft.meta.name=this.value; persistDraft();" />
      <span class="badge ${wizardDraft.status==='published'?'published':'draft'}">${wizardDraft.status}</span>
    </div>
    <div class="steps">
      ${steps.map(([k,label])=>`<div class="step ${wizardStep===k?'on':''}" onclick="wizardStep='${k}'; render();">${label}</div>`).join('')}
    </div>
    ${renderSizeIndicator()}
    <div id="wizbody">${wizardStep==='upload'?stepUpload(): wizardStep==='verify'?stepVerify(): wizardStep==='configure'?stepConfigure(): stepPreview()}</div>
  `;
}
function afterWizardRender(){ if(wizardStep==='upload') setupDragDrop(); }
/** Recalculated fresh on every call — cheap even for a large test, and it's
    the single choke point every edit path (question edits, config changes,
    publish) already flows through, so this is the one place that needs to
    know about the 1 MiB limit. Returns whether the save actually went
    through, so callers like publishTest() can avoid claiming success when
    it didn't. */
function persistDraft(){
  const bytes = estimateTestSizeBytes(wizardDraft);
  if(bytes >= FIRESTORE_DOC_LIMIT){
    toast('Too large to save (over Firestore\'s 1 MiB document limit) — this change is kept on-screen but not yet saved to the server. Remove or shrink an image to continue.');
    return false;
  }
  saveTest(wizardDraft);
  return true;
}

const AI_CONVERSION_PROMPT = `I have a question paper that needs converting into a specific plain-text format so I can upload it to a quiz tool. Please reformat the question paper I paste below (or attach) into exactly this layout, question by question.

IMPORTANT — output format: put your entire answer inside a single fenced code block (triple backticks), with nothing before or after it, and do not use any markdown formatting (no bold, no bullet points, no auto-numbered lists) inside it. This matters because outside a code block, chat interfaces often collapse single line breaks and squash multiple options onto one line — a code block is what keeps every option on its own separate line.

For a multiple-choice or true/false question, use lettered options and a letter answer, each on its own line:
1. <question text>
A) <option A>
B) <option B>
C) <option C>
D) <option D>
Answer: <correct option letter>

For a true/false question specifically, use exactly two options worded as True and False:
2. <question text>
A) True
B) False
Answer: <A or B>

For a question that expects a typed numeric answer (not multiple choice), skip the lettered options entirely and give the accepted answer as a number or a range right after the question:
3. <question text>
Answer: <exact number>

4. <question text>
Answer: <minimum number>-<maximum number>

Rules:
- Number every question sequentially starting at 1, followed by a period and a space (e.g. "1. ").
- Give each option a single capital letter followed by a closing parenthesis and a space (e.g. "A) ").
- Each option MUST be on its own separate line — never place two or more options on the same line, and never separate them with commas or slashes instead of a line break.
- Include an "Answer:" line right after each question (after its options, if it has any), on its own line. If you can't determine the correct answer, write "Answer: " with nothing after it rather than guessing.
- Only use the numeric "Answer: min-max" or "Answer: number" format for questions that genuinely expect a typed numeric answer, not multiple choice — never mix lettered options with a numeric answer line on the same question.
- Output ONLY the reformatted questions in the format above, inside the single code block described above — no headers, page numbers, explanations, or commentary, and nothing outside that code block.
- Keep the original question text and options exactly as written; only reformat the layout and numbering.

Here is the question paper to convert:
[PASTE YOUR QUESTION PAPER TEXT OR ATTACH THE FILE HERE]`;

function setProgress(msg){

async function handleFileUpload(file){
  if(!file) return;
  setFilePill(file.name);
  const name = file.name.toLowerCase();
  try{
    if(name.endsWith('.txt') || file.type==='text/plain'){
      const text = await file.text();
      document.getElementById('pasteArea').value = text;
      toast('Text file loaded — click Extract');
    } else if(name.endsWith('.pdf') || file.type==='application/pdf'){
      await extractPdfFile(file);
    } else if(file.type.startsWith('image/')){
      await extractImageFile(file);
    } else {
      toast('Unsupported file type — try .txt, .pdf, or an image');
    }
  } catch(err){
    console.error(err);
    setProgress('');
    toast('Could not read that file — try pasting the text instead');
  }
}
async function extractPdfFile(file){
  if(typeof pdfjsLib === 'undefined'){ toast('PDF reader failed to load — check your internet connection'); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  setProgress('Reading PDF…');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let fullText='';
  let hasText=false;
  for(let i=1;i<=pdf.numPages;i++){
    setProgress(`Reading page ${i} of ${pdf.numPages}…`);
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(it=>it.str).join(' ');
    if(pageText.trim().length>0) hasText=true;
    fullText += pageText + '\n';
  }
  if(!hasText){
    // scanned PDF with no embedded text layer — fall back to OCR on rendered pages
    setProgress('No embedded text found — running OCR on scanned pages, this can take a minute…');
    fullText = await ocrPdfPages(pdf);
  }
  document.getElementById('pasteArea').value = cleanupExtractedText(fullText);
  setProgress('');
  toast('PDF text extracted — review it below, then click Extract Questions');
}
async function ocrPdfPages(pdf){
  let text='';
  for(let i=1;i<=pdf.numPages;i++){
    setProgress(`OCR on page ${i} of ${pdf.numPages}…`);
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale:2});
    const canvas = document.createElement('canvas');
    canvas.width=viewport.width; canvas.height=viewport.height;
    await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
    const {data:{text:pageText}} = await Tesseract.recognize(canvas, 'eng', {
      logger: m=>{ if(m.status==='recognizing text') setProgress(`OCR on page ${i} of ${pdf.numPages} — ${Math.round(m.progress*100)}%`); }
    });
    text += pageText + '\n';
  }
  return text;
}
async function extractImageFile(file){
  if(typeof Tesseract === 'undefined'){ toast('OCR engine failed to load — check your internet connection'); return; }
  setProgress('Running OCR on image — this can take up to a minute…');
  const {data:{text}} = await Tesseract.recognize(file, 'eng', {
    logger: m=>{ if(m.status==='recognizing text') setProgress(`OCR in progress — ${Math.round(m.progress*100)}%`); }
  });
  document.getElementById('pasteArea').value = cleanupExtractedText(text);
  setProgress('');
  toast('Text extracted from image — review it below, then click Extract Questions');
}
function cleanupExtractedText(text){
  // collapse excess blank lines/spaces that PDF/OCR extraction tends to introduce
  return text.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}
function setupDragDrop(){
  const dz=document.getElementById('dz'); if(!dz) return;
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove('drag'); }));

function moveQ(id,dir){

/** Shrinks and compresses an uploaded image to a JPEG data URI before it's
    stored — since images live embedded in the test document (no separate
    file storage in this build), keeping them small matters for Firestore's
    per-document size limit and for keeping reads/writes cheap. */
function compressImageToDataURI(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth/img.width);
        const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleModalImageFile(file){
  if(!file) return;

/* ============================================================
   RESULTS + ANALYTICS
   ============================================================ */
function computeQuestionStats(test, results){
  const total = results.length;
  return test.questions.map((q,i)=>{
    let attempted=0, correct=0, wrong=0, marksEarned=0;
    results.forEach(r=>{
      const given = r.answers && r.answers[q.id];
      if(given && given.length){
        attempted++;
        if(r.perQuestionCorrect && r.perQuestionCorrect[q.id]){ correct++; marksEarned += q.marks; }
        else{
          wrong++;
          const neg = test.config.negativeMarking ? (q.negativeMarks || test.config.negativeValue) : 0;
          marksEarned -= neg;
        }
      }
    });
    const unattempted = total - attempted;
    const accuracy = attempted? (correct/attempted*100) : null;
    const avgMarks = total? (marksEarned/total) : 0;
    let difficulty = 'No data';
    if(accuracy!==null){
      difficulty = accuracy>=75 ? 'Easy' : accuracy>=40 ? 'Moderate' : 'Hard';
    }
    return {
      index:i+1, id:q.id, text:q.text, marks:q.marks,
      total, attempted, unattempted, correct, wrong, accuracy, avgMarks, difficulty,
      highWrongRate: attempted>0 && (wrong/attempted)>=0.5,
      oftenUnattempted: total>0 && (unattempted/total)>=0.5
    };
  });
}
function viewResults(testId){
  const db=getDB();

  if(!test) return `<div class="empty card"><h3>Test not found</h3></div>`;
  const results=(db.results[testId]||[]).sort((a,b)=>b.percentage-a.percentage);
  const n=results.length;
  const avg = n? (results.reduce((a,r)=>a+r.percentage,0)/n).toFixed(1):0;
  const high = n? Math.max(...results.map(r=>r.percentage)).toFixed(1):0;
  const low = n? Math.min(...results.map(r=>r.percentage)).toFixed(1):0;
  const passN = results.filter(r=>r.percentage>=test.config.passPercent).length;
  const passPct = n? ((passN/n)*100).toFixed(0):0;

  const qStats = computeQuestionStats(test, results);
  const withData = qStats.filter(q=>q.accuracy!==null);
  const hardest = withData.length? withData.reduce((a,b)=> a.accuracy<b.accuracy?a:b): null;

      <div class="stat"><div class="num">${low}%</div><div class="lbl">Lowest score</div></div>

      <strong class="small">Submissions</strong>

        <button class="btn secondary small" onclick="promptReleaseMobile('${testId}')">Release a mobile number</button>
        <button class="btn secondary small" ${n===0?'disabled':''} onclick="exportCSV('${testId}')">Export CSV</button>
      </div>
    </div>
    <p class="small muted" style="margin-top:-4px; margin-bottom:14px;">A mobile number is locked to one attempt per test. If a student's attempt got stuck (e.g. they never finished), release their number here so they can try again.</p>

    ${n===0? `<div class="empty card"><h3>No submissions yet</h3><p>As soon as a student submits, from any device, it appears here automatically.</p></div>`:`
    <div class="card pad" style="overflow:auto;">
      <table class="results">
        <thead><tr><th>Name</th><th>Class</th><th>Roll No.</th><th>Mobile Number</th><th>Score</th><th>%</th><th>Tab switches</th><th>Time</th><th>Status</th><th></th><th></th></tr></thead>
        <tbody>
          ${results.map(r=>`
            <tr>
              <td>${esc(r.student.name)}</td>
              <td>${esc(r.student.class||'')}</td>
              <td>${esc(r.student.roll||'')}</td>
              <td>${esc(r.student.mobile||'')}</td>
              <td>${r.score} / ${r.maxScore}</td>
              <td>${r.percentage.toFixed(1)}%</td>

              <td><button class="btn ghost small" onclick="openResponseModal('${testId}','${r.id}')">View responses</button></td>

    <div class="section-title" style="margin-top:34px;">Question-wise Analytics</div>

    ${hardest||easiest? `<div class="card pad small" style="margin-bottom:16px;">
      ${hardest? `<div>Most difficult: <strong>Q${hardest.index}</strong> — ${esc(hardest.text.slice(0,70))}${hardest.text.length>70?'…':''} (${hardest.accuracy.toFixed(0)}% accuracy)</div>`:''}
      ${easiest? `<div style="margin-top:4px;">Easiest: <strong>Q${easiest.index}</strong> — ${esc(easiest.text.slice(0,70))}${easiest.text.length>70?'…':''} (${easiest.accuracy.toFixed(0)}% accuracy)</div>`:''}
    </div>`:''}
    <div class="card pad" style="overflow:auto;">
      <table class="results">
        <thead><tr><th>Q#</th><th>Question</th><th>Total</th><th>Attempted</th><th>Unattempted</th><th>Correct</th><th>Wrong</th><th>Accuracy</th><th>Avg Marks</th><th>Difficulty</th><th>Flags</th></tr></thead>
        <tbody>
          ${qStats.map(q=>`
            <tr>
              <td>Q${q.index}</td>
              <td style="max-width:280px;">${esc(q.text.slice(0,90))}${q.text.length>90?'…':''}</td>
              <td>${q.total}</td>
              <td>${q.attempted}</td>
              <td>${q.unattempted}</td>
              <td>${q.correct}</td>
              <td>${q.wrong}</td>
              <td>${q.accuracy!==null? q.accuracy.toFixed(0)+'%' : '—'}</td>
              <td>${q.avgMarks.toFixed(2)}</td>
              <td><span class="badge ${q.difficulty==='Easy'?'verified':q.difficulty==='Hard'?'review':q.difficulty==='Moderate'?'edited':'draft'}">${q.difficulty}</span></td>
              <td>
                ${q.highWrongRate? '<span class="badge review" title="Half or more of attempts were wrong">⚠ High wrong rate</span> ':''}
                ${q.oftenUnattempted? '<span class="badge draft" title="Half or more of students skipped this">⏭ Often skipped</span>':''}
              </td>
            </tr>`).join('')}

      </table>
    </div>`}

    ${renderUnfinishedSection(testId)}
  `;
}
let unfinishedFilter = 'all'; // 'all' | 'inprogress' | 'expired' | 'reset'
function setUnfinishedFilter(f){ unfinishedFilter=f; render(); }
/** In Progress / Expired / Reset aren't three separately-stored statuses.
    Firestore only ever holds 'in-progress', 'submitted', or (once a
    teacher resets one) 'invalidated'. In Progress vs. Expired is derived
    here, at display time, purely from data already on the attempt: if
    its own time allowance has elapsed but it was never submitted, the
    student's browser is gone and it will never complete on its own. */
function renderUnfinishedSection(testId){
  const test = getDB().tests[testId];
  const raw = getDB().unfinished[testId] || [];
  const now = Date.now();
  const withStatus = raw.map(a=>({...a, _status: deriveAttemptStatus(a, now), _elapsed: now - a.startedAt}));
  const counts = {
    inprogress: withStatus.filter(a=>a._status==='In Progress').length,
    expired: withStatus.filter(a=>a._status==='Expired/Time Up').length,
    reset: withStatus.filter(a=>a._status==='Reset/Invalidated').length
  };
  const filterMap = {inprogress:'In Progress', expired:'Expired/Time Up', reset:'Reset/Invalidated'};
  const filtered = unfinishedFilter==='all' ? withStatus : withStatus.filter(a=>a._status===filterMap[unfinishedFilter]);
  const totalQ = test? test.questions.length : '?';

  return `
    <div class="section-title" style="margin-top:34px;">Unfinished Attempts</div>
    <div class="row" style="gap:8px; margin-bottom:14px;">
      <button class="btn ${unfinishedFilter==='all'?'secondary':'ghost'} small" onclick="setUnfinishedFilter('all')">All (${withStatus.length})</button>
      <button class="btn ${unfinishedFilter==='inprogress'?'secondary':'ghost'} small" onclick="setUnfinishedFilter('inprogress')">In Progress (${counts.inprogress})</button>
      <button class="btn ${unfinishedFilter==='expired'?'secondary':'ghost'} small" onclick="setUnfinishedFilter('expired')">Expired/Time Up (${counts.expired})</button>
      <button class="btn ${unfinishedFilter==='reset'?'secondary':'ghost'} small" onclick="setUnfinishedFilter('reset')">Reset/Invalidated (${counts.reset})</button>
    </div>
    ${filtered.length===0? `<div class="empty card"><p>No matching attempts.</p></div>` : `
    <div class="card pad" style="overflow:auto;">
      <table class="results">
        <thead><tr><th>Name</th><th>Class</th><th>Roll No.</th><th>Started At</th><th>Time Elapsed</th><th>Last Activity</th><th>Answered</th><th>Tab switches</th><th>Status</th><th></th><th></th></tr></thead>
        <tbody>
          ${filtered.map(a=>{
            const answered = Object.keys(a.answers||{}).length;
            const lastActivityMs = (a.heartbeatAt && a.heartbeatAt.toMillis) ? a.heartbeatAt.toMillis() : (a.invalidatedAt || a.startedAt);
            const badgeClass = a._status==='Expired/Time Up' ? 'review' : a._status==='Reset/Invalidated' ? 'draft' : 'edited';
            const canReset = a._status!=='Reset/Invalidated';
            return `
            <tr>
              <td>${esc(a.student.name)}</td>
              <td>${esc(a.student.class||'')}</td>
              <td>${esc(a.student.roll||'')}</td>
              <td>${fmtDateTimeExact(a.startedAt)}</td>
              <td>${fmtTime(a._elapsed)}</td>
              <td>${fmtDateTimeExact(lastActivityMs)}</td>
              <td>${answered} / ${totalQ}</td>
              <td>${a.tabSwitches||0}</td>
              <td><span class="badge ${badgeClass}">${a._status}</span></td>
              <td><button class="btn ghost small" onclick="openProgressModal('${testId}','${a.id}')">View Progress</button></td>
              <td>${canReset? `<button class="btn danger small" onclick="resetAttempt('${testId}','${a.id}','${a.mobileKey||''}')">Reset</button>` : ''}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`}
  `;
}
/** Shows exactly what a student has answered so far, without waiting for
    (or requiring) a submission — reads only the attempt data already in
    memory from the live Results listener, no extra Firestore call. */
function openProgressModal(testId, attemptId){
  const test = getDB().tests[testId];
  const a = (getDB().unfinished[testId]||[]).find(x=>x.id===attemptId);
  if(!test || !a) return;
  const key = answerKeyCache[testId] || null; // only ever already-cached; never fetched just for this view
  const answered = Object.keys(a.answers||{}).length;
  const modal=document.createElement('div');
  modal.className='modalbg';
  modal.innerHTML = `
    <div class="modal" style="max-width:680px;">
      <h3 style="margin-bottom:2px;">${esc(a.student.name)}</h3>
      <p class="muted small" style="margin-bottom:16px;">${esc(a.student.class||'')} ${esc(a.student.roll||'')} · ${answered} / ${test.questions.length} answered so far · status: ${deriveAttemptStatus(a, Date.now())}</p>
      ${test.questions.map((q,i)=>renderQuestionReviewCard(q, i, (a.answers&&a.answers[q.id]), undefined, key && key[q.id])).join('')}
